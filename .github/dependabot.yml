version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── Docker ────────────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /apps/admin-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-admin-api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
