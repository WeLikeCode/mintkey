version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── Docker ────────────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /apps/admin-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-admin-api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-mcp-server-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/admin-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-admin-ui-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/broker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-broker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/vault-adapter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-vault-adapter-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/proxy-plugin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-proxy-plugin-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/kong-syncer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-kong-syncer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/seed-job
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-seed-job-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/mock-backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-mock-backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/jaeger-auth
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-jaeger-auth-minor-patch:
        update-types: [minor, patch]

  # ── uv (Python) ───────────────────────────────────────────────────────────
  # The three uv projects: the uv ecosystem updates pyproject.toml and uv.lock together, so a raised floor
  # never leaves a stale lock behind (CI lints and tests with `uv sync --locked`).
  - package-ecosystem: uv
    directory: /apps/admin-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      uv-admin-api-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ruff 0.17 reports about 650 new findings across the three projects (UP045, B008 for FastAPI Depends
      # defaults, I001, BLE001, ...): adopting it needs a ruff rule decision and a fix pass of its own, not a
      # lock bump. CI lints with the locked ruff (`uv sync --locked`), so a group PR carrying it fails Lint Python.
      - dependency-name: ruff
        versions: [">=0.17"]

  - package-ecosystem: uv
    directory: /apps/mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      uv-mcp-server-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ruff 0.17 reports about 650 new findings across the three projects (UP045, B008 for FastAPI Depends
      # defaults, I001, BLE001, ...): adopting it needs a ruff rule decision and a fix pass of its own, not a
      # lock bump. CI lints with the locked ruff (`uv sync --locked`), so a group PR carrying it fails Lint Python.
      - dependency-name: ruff
        versions: [">=0.17"]

  - package-ecosystem: uv
    directory: /packages/python/mintkey-models
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      uv-mintkey-models-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ruff 0.17 reports about 650 new findings across the three projects (UP045, B008 for FastAPI Depends
      # defaults, I001, BLE001, ...): adopting it needs a ruff rule decision and a fix pass of its own, not a
      # lock bump. CI lints with the locked ruff (`uv sync --locked`), so a group PR carrying it fails Lint Python.
      - dependency-name: ruff
        versions: [">=0.17"]

  # ── npm (Node / TypeScript) ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/admin-ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
