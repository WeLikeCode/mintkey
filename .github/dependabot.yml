        update-types: [minor, patch]

  # ── Go modules ────────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /apps/broker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod-broker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/vault-adapter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod-vault-adapter-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/proxy-plugin
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod-proxy-plugin-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/kong-syncer
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gomod-kong-syncer-minor-patch:
        update-types: [minor, patch]
