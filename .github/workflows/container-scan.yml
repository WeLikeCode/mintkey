name: Container Scan (Trivy)

on:
  # Re-scan after every merge to main so the Code Scanning dashboard reflects
  # actual main-branch image state. Without this, image-pin PRs (e.g., PR #70
  # postgres pin, PR #74 the 8-image bulk pin) close on merge but Trivy never
  # re-runs against main and the dashboard keeps reporting pre-pin findings as
  # "Open" until the next weekly cron — confusing for operators auditing the
  # security tab.
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - "docker-compose.yml"
      - "docker-compose*.yml"
      - "**/requirements.txt"
      - "**/pyproject.toml"
      - "**/go.mod"
      - "**/go.sum"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      # Trigger on any Dockerfile or compose file change
      - "**/Dockerfile"
      - "docker-compose.yml"
      - "docker-compose*.yml"
      # Also trigger on dependency file changes that feed images
      - "**/requirements.txt"
      - "**/pyproject.toml"
      - "**/go.mod"
      - "**/go.sum"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: "0 6 * * 0"
  # Manual re-trigger — operator action via Actions tab. Used to refresh the
  # dashboard after security advisories rotate or to validate fixes outside
  # the cron cadence.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build + Trivy scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # context: . (repo root) — Dockerfiles that COPY sibling directories
          # (packages/python/mintkey-models/, go.work, packages/go/, other service go.mod files).
          - service: admin-api
            context: .
            dockerfile: apps/admin-api/Dockerfile
            image: mintkey-admin-api
          - service: mcp-server
            context: .
            dockerfile: apps/mcp-server/Dockerfile
            image: mintkey-mcp-server
          - service: broker
            context: .
            dockerfile: apps/broker/Dockerfile
            image: mintkey-broker
          - service: vault-adapter
            context: .
            dockerfile: apps/vault-adapter/Dockerfile
            image: mintkey-vault-adapter
          - service: proxy-plugin
            context: .
            dockerfile: apps/proxy-plugin/Dockerfile
            image: mintkey-proxy-plugin
          - service: kong-syncer
            context: .
            dockerfile: apps/kong-syncer/Dockerfile
            image: mintkey-kong-syncer
          # context: subdirectory — self-contained Dockerfiles with no sibling COPYs.
          - service: admin-ui
            context: apps/admin-ui
            dockerfile: apps/admin-ui/Dockerfile
            image: mintkey-admin-ui
          - service: seed-job
            context: apps/seed-job
            dockerfile: apps/seed-job/Dockerfile
            image: mintkey-seed-job
          - service: mock-backend
            context: apps/mock-backend
            dockerfile: apps/mock-backend/Dockerfile
            image: mintkey-mock-backend
          - service: jaeger-auth
            context: apps/jaeger-auth
            dockerfile: apps/jaeger-auth/Dockerfile
            image: mintkey-jaeger-auth
          # ssh-proxy added in fix/ssh-proxy-integration (PR #138)
          - service: ssh-proxy
            context: .
            dockerfile: apps/ssh-proxy/Dockerfile
            image: mintkey-ssh-proxy
          # email-proxy added in feat/email-proxy (ADR-0024 / C-11)
          - service: email-proxy
            context: .
            dockerfile: apps/email-proxy/Dockerfile
            image: mintkey-email-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image — ${{ matrix.service }}
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "${{ matrix.image }}:scan" \
            "${{ matrix.context }}"

      # ── Trivy gating policy ──────────────────────────────────────────────────
      # Two-step scan:
      #   Step 1 (report): scan ALL severities → SARIF → Security tab.
      #                    exit-code 0 so this step never blocks the job.
      #   Step 2 (gate):   scan HIGH/CRITICAL only → table → exit-code 1 on PRs.
      #                    MEDIUM/LOW findings are visible in the Security tab
      #                    but do NOT block merge (industry default; matches
      #                    Snyk/Dependabot/most internal gates).
      # Suppressions for specific CVEs live in repo-root .trivyignore with
      # per-CVE justification + review-by date.
      # Secret scanner is disabled in both steps: Trivy fires false positives on
      # template files that document credential formats (e.g. GCP SA JSON shape
      # hints).  GitHub's own secret scanning covers actual secrets in the repo.
      - name: Trivy scan — ${{ matrix.service }} (all severities → SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.image }}:scan"
          format: sarif
          output: "trivy-${{ matrix.service }}.sarif"
          scanners: vuln
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          exit-code: "0"
          ignore-unfixed: false
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF — ${{ matrix.service }}
        # Upload results even when the gate step below exits non-zero so
        # findings appear in the Security tab. always() ensures the upload
        # runs even after a gate failure.
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: "trivy-${{ matrix.service }}.sarif"
          category: "trivy-${{ matrix.service }}"

      - name: Trivy scan — ${{ matrix.service }} (gate on HIGH/CRITICAL)
        # Exit-code policy:
        # - pull_request → "1" so PRs that ADD new HIGH/CRITICAL CVEs are blocked.
        # - push / schedule / workflow_dispatch → "0" so main-branch and cron
        #   runs don't chronically fail on accepted Debian-base CVEs already
        #   tracked in the Security tab.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.image }}:scan"
          format: table
          scanners: vuln
          severity: "HIGH,CRITICAL"
          exit-code: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          ignore-unfixed: false
          trivyignores: .trivyignore
