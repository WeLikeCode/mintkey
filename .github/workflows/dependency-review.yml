name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail on moderate or higher severity vulnerabilities
          fail-on-severity: moderate

          # License policy — Apache-2.0 project (OSS-1 decision E-1)
          # Allow common permissive licenses compatible with Apache-2.0
          allow-licenses: >-
            Apache-2.0,
            MIT,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Unlicense,
            CC0-1.0,
            Python-2.0,
            PSF-2.0

          # Targeted per-package license exceptions (OSS-1 decision E-1).
          # The global allow-licenses policy above stays strict for production
          # code; these specific entries are dev/test/transitive dependencies
          # whose licenses (MPL-2.0, MIT-0, BlueOak-1.0.0) are permissive or
          # weak file-level copyleft and impose no obligations on this
          # Apache-2.0 codebase when consumed only as test/build/transitive deps:
          #   - pgregory.net/rapid, hypothesis: property-based-testing libs (MPL-2.0, test-only)
          #   - @csstools/*: admin-ui build-time transitive deps (MIT-0)
          #   - lru-cache: admin-ui transitive dep (BlueOak-1.0.0)
          allow-dependencies-licenses: >-
            pkg:golang/pgregory.net/rapid,
            pkg:pypi/hypothesis,
            pkg:npm/@csstools/color-helpers,
            pkg:npm/@csstools/css-syntax-patches-for-csstree,
            pkg:npm/lru-cache

          # Post a comment on the PR with the review summary
          comment-summary-in-pr: always
