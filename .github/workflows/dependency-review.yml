name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          # Fail on moderate or higher severity vulnerabilities
          fail-on-severity: moderate

          # License policy — Apache-2.0 project (OSS-1 decision E-1)
          # Allow common permissive licenses compatible with Apache-2.0
          allow-licenses: >-
            Apache-2.0,
            MIT,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            Unlicense,
            CC0-1.0,
            Python-2.0,
            PSF-2.0

          # Targeted per-package license exceptions (OSS-1 decision E-1).
          # The global allow-licenses policy above stays strict for production
          # code; these specific entries are dev/test/transitive dependencies
          # whose licenses (MPL-2.0, MIT-0, BlueOak-1.0.0) are permissive or
          # weak file-level copyleft and impose no obligations on this
          # Apache-2.0 codebase when consumed only as test/build/transitive deps:
          #   - pgregory.net/rapid, hypothesis: property-based-testing libs (MPL-2.0, test-only)
          #   - hashicorp/go-secure-stdlib/{parseutil,strutil}: transitive deps of
          #     hashicorp/vault/api (MPL-2.0). MPL-2.0 is file-level weak copyleft —
          #     modifications to these files must be released as MPL but consuming
          #     application code (Mintkey) is not subject to copyleft. Same rationale
          #     as pgregory.net/rapid.
          #   - @csstools/*: admin-ui build-time transitive deps (MIT-0)
          #   - lru-cache: admin-ui transitive dep (BlueOak-1.0.0)
          #   - golang.org/x/{sync,net,time,text}: BSD-3-Clause + the standard Go patent grant
          #     (reported as a compound expr with a non-SPDX scancode LicenseRef);
          #     permissive Go stdlib-adjacent libs (singleflight, HTTP/2, rate-limiter, etc.).
          #     golang.org/x/time added as transitive dep of ssh-proxy in PR #138.
          #     golang.org/x/text added as transitive dep of ssh-proxy in PR #139.
          #   - google.golang.org/protobuf: BSD-3-Clause + Google patent grant (same LicenseRef
          #     pattern as golang.org/x/*); permissive in practice, required by gRPC.
          #   - stretchr/testify, gopkg.in/yaml.v3, types-PyYAML: permissive
          #     test/build deps (MIT / MIT-Apache / Apache-2.0) whose license the
          #     scanner could not auto-resolve (reported "unknown").
          #   - asyncssh: LGPL-2.1 (scanner reports "unknown"); used in admin-api for
          #     SSH credential validation. LGPL-2.1 permits use as a library without
          #     copyleft obligation on the consuming application (weak copyleft).
          #   - pytest-asyncio: Apache-2.0 (scanner reports "unknown" for some versions).
          #   - ssh-proxy Go transitive deps (beorn7/perks, cespare/xxhash/v2, go-logr/logr,
          #     go-logr/stdr, golang-jwt/jwt/v5, google/uuid, pmezard/go-difflib,
          #     prometheus/client_golang, prometheus/client_model, prometheus/common,
          #     prometheus/procfs, go.opentelemetry.io/auto/sdk, genproto/googleapis/rpc,
          #     google.golang.org/grpc): MIT / Apache-2.0 / BSD-3-Clause; scanner reports
          #     "unknown" for some due to LicenseRef compound expressions. All are
          #     well-known permissive open-source libraries.
          #   - react-router-dom, tinyglobby, tldts, tldts-core, tsx: MIT (scanner reports
          #     "could not detect" after pnpm lockfile regen in PR #140); all confirmed via
          #     `pnpm view <pkg> license` from apps/admin-ui/.
          #   - tinymce: GPL-2.0-or-later (dual-licensed; pnpm view tinymce@7.9.3 license).
          #     Transitive dep pulled by @adminjs/design-system (MIT). The GPL applies to the
          #     TinyMCE editor library itself; it does not propagate copyleft obligations to
          #     Mintkey's server-side Apache-2.0 code. Admin-UI is an operator-internal
          #     frontend panel only. Scanner reports "could not detect" because the package.json
          #     contains "SEE LICENSE IN license.md" instead of a plain SPDX identifier.
          #     Confirmed via `pnpm view tinymce@7.9.3 license` = GPL-2.0-or-later.
          allow-dependencies-licenses: >-
            pkg:golang/pgregory.net/rapid,
            pkg:pypi/hypothesis,
            pkg:golang/github.com/hashicorp/go-secure-stdlib/parseutil,
            pkg:golang/github.com/hashicorp/go-secure-stdlib/strutil,
            pkg:npm/@csstools/color-helpers,
            pkg:npm/@csstools/css-syntax-patches-for-csstree,
            pkg:npm/lru-cache,
            pkg:golang/golang.org/x/sync,
            pkg:golang/golang.org/x/net,
            pkg:golang/golang.org/x/time,
            pkg:golang/golang.org/x/text,
            pkg:golang/google.golang.org/protobuf,
            pkg:golang/github.com/stretchr/testify,
            pkg:golang/gopkg.in/yaml.v3,
            pkg:pypi/types-pyyaml,
            pkg:pypi/asyncssh,
            pkg:pypi/pytest-asyncio,
            pkg:golang/github.com/beorn7/perks,
            pkg:golang/github.com/cespare/xxhash/v2,
            pkg:golang/github.com/go-logr/logr,
            pkg:golang/github.com/go-logr/stdr,
            pkg:golang/github.com/golang-jwt/jwt/v5,
            pkg:golang/github.com/google/uuid,
            pkg:golang/github.com/pmezard/go-difflib,
            pkg:golang/github.com/prometheus/client_golang,
            pkg:golang/github.com/prometheus/client_model,
            pkg:golang/github.com/prometheus/common,
            pkg:golang/github.com/prometheus/procfs,
            pkg:golang/go.opentelemetry.io/auto/sdk,
            pkg:golang/go.opentelemetry.io/otel,
            pkg:golang/go.opentelemetry.io/otel/metric,
            pkg:golang/go.opentelemetry.io/otel/sdk,
            pkg:golang/go.opentelemetry.io/otel/trace,
            pkg:golang/google.golang.org/genproto/googleapis/rpc,
            pkg:golang/google.golang.org/grpc,
            pkg:npm/react-router-dom,
            pkg:npm/tinyglobby,
            pkg:npm/tinymce,
            pkg:npm/tldts,
            pkg:npm/tldts-core,
            pkg:npm/tsx,
            pkg:npm/caniuse-lite,
            pkg:pypi/uv

          # Post a comment on the PR with the review summary
          comment-summary-in-pr: always
