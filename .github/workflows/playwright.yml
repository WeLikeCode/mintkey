name: Mintkey Playwright E2E

# On PRs: chromium only (fast feedback).
# Nightly: all three browsers (cross-browser coverage).
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/admin-ui/**"
      - "apps/admin-api/**"
      - "docker-compose.yml"
      - ".github/workflows/playwright.yml"
  schedule:
    # Nightly at 02:00 UTC — runs all three browsers
    - cron: "0 2 * * *"

permissions:
  contents: read

env:
  # pnpm 11 imports `node:sqlite` for its store cache; that builtin requires
  # Node ≥22.5. Node 20 crashes with ERR_UNKNOWN_BUILTIN_MODULE during the
  # very first `pnpm install --frozen-lockfile` step. Bumped 2026-05-18.
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # PR job: chromium only
  # ─────────────────────────────────────────────────────────────────────────
  playwright-chromium:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install admin-ui dependencies
        working-directory: apps/admin-ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        working-directory: apps/admin-ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Mintkey stack
        run: |
          docker compose up -d --wait --timeout 120
        env:
          COMPOSE_HTTP_TIMEOUT: 120

      - name: Wait for admin-ui to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/health && break
            echo "Waiting for admin-ui ($i/30)..."
            sleep 5
          done

      - name: Run Playwright tests (chromium)
        working-directory: apps/admin-ui
        run: pnpm test:e2e --project=chromium
        env:
          PLAYWRIGHT_PASS: ${{ secrets.PLAYWRIGHT_PASS }}
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          CI: "true"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-chromium-${{ github.run_id }}
          path: apps/admin-ui/e2e/playwright-report/
          retention-days: 14

      - name: Upload JUnit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-junit-chromium-${{ github.run_id }}
          path: apps/admin-ui/e2e/test-results/junit.xml
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # ─────────────────────────────────────────────────────────────────────────
  # Nightly job: all three browsers
  # ─────────────────────────────────────────────────────────────────────────
  playwright-all-browsers:
    name: Playwright (all browsers) — nightly
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install admin-ui dependencies
        working-directory: apps/admin-ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (${{ matrix.browser }})
        working-directory: apps/admin-ui
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Start Mintkey stack
        run: |
          docker compose up -d --wait --timeout 120
        env:
          COMPOSE_HTTP_TIMEOUT: 120

      - name: Wait for admin-ui to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/health && break
            echo "Waiting for admin-ui ($i/30)..."
            sleep 5
          done

      - name: Run Playwright tests (${{ matrix.browser }})
        working-directory: apps/admin-ui
        run: pnpm test:e2e --project=${{ matrix.browser }}
        env:
          PLAYWRIGHT_PASS: ${{ secrets.PLAYWRIGHT_PASS }}
          PLAYWRIGHT_BASE_URL: http://localhost:8081
          CI: "true"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}-nightly-${{ github.run_id }}
          path: apps/admin-ui/e2e/playwright-report/
          retention-days: 30

      - name: Upload JUnit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-junit-${{ matrix.browser }}-nightly-${{ github.run_id }}
          path: apps/admin-ui/e2e/test-results/junit.xml
          retention-days: 30

      - name: Tear down stack
        if: always()
        run: docker compose down -v
