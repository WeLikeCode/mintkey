[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admin-api"
version = "0.1.0.dev0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "grpcio>=1.80",
    "protobuf>=6.31",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "prometheus-client>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/admin_api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.7",
]

[tool.uv]
default-groups = ["dev"]
