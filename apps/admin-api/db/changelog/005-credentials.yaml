databaseChangeLog:
  - changeSet:
      id: "005-credentials"
      author: mintkey
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_credentials_tenant
                    references: tenants(id)
              - column:
                  name: service_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_credentials_service
                    references: services(id)
              - column:
                  name: key_version
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: ciphertext
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: nonce
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: wrapped_dek
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: auth_scheme
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  defaultValue: active
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMPTZ
      rollback:
        - dropTable:
            tableName: credentials

  - changeSet:
      id: "005-credentials-rls"
      author: mintkey
      changes:
        - sql:
            sql: |
              ALTER TABLE credentials ENABLE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON credentials
                USING (
                  tenant_id = current_setting('app.current_tenant', true)::uuid
                  OR current_setting('app.platform_admin_view', true) = 'on'
                );
      rollback:
        - sql:
            sql: |
              DROP POLICY IF EXISTS tenant_isolation ON credentials;
              ALTER TABLE credentials DISABLE ROW LEVEL SECURITY;
