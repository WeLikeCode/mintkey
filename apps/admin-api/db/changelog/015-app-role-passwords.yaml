databaseChangeLog:

  - changeSet:
      id: "015-set-app-role-passwords"
      author: "fix-bootstrap"
      changes:
        - sql:
            sql: |
              ALTER ROLE mintkey_app WITH PASSWORD 'mintkey_app_password';
              ALTER ROLE mintkey_subscriber WITH PASSWORD 'mintkey_subscriber_password';
      rollback:
        - sql:
            sql: |
              ALTER ROLE mintkey_app WITH PASSWORD NULL;
              ALTER ROLE mintkey_subscriber WITH PASSWORD NULL;
