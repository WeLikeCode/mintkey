databaseChangeLog:

  - changeSet:
      id: "015-set-app-role-passwords"
      author: "fix-bootstrap"
      # The statement now takes its passwords from Liquibase properties, so its checksum
      # depends on the values supplied. Installs that already ran 015 with the old literals
      # must keep migrating when an operator supplies different passwords (they rotate the
      # Postgres roles by hand, see ADR-0033 D4); a fresh DB runs it with the supplied values.
      validCheckSum:
        - ANY
      changes:
        - sql:
            sql: |
              ALTER ROLE mintkey_app WITH PASSWORD '${db_app_password}';
              ALTER ROLE mintkey_subscriber WITH PASSWORD '${db_subscriber_password}';
      rollback:
        - sql:
            sql: |
              ALTER ROLE mintkey_app WITH PASSWORD NULL;
              ALTER ROLE mintkey_subscriber WITH PASSWORD NULL;
