databaseChangeLog:
  # -----------------------------------------------------------------------
  # 027-agent-secrets.yaml
  #
  # Creates the tables required for agent-stored secrets (ADR-0025).
  #
  # New tables:
  #   public.agent_secrets        — metadata for agent-owned KV secrets
  #   public.agent_secret_grants  — operator-managed read grants between agents
  #   vault.agent_secrets         — encrypted blobs (mirrors vault.credentials style)
  #
  # New column:
  #   public.agents.created_by    — nullable attribution for future sharing tightening
  #
  # RLS policies follow the pattern from 003-agents.yaml / 005-credentials.yaml:
  #   tenant_id = current_setting('app.current_tenant', true)::uuid
  #   OR current_setting('app.platform_admin_view', true) = 'on'
  #
  # Idempotent: MARK_RAN preConditions guard each changeset.
  # Source: ADR-0025; openspec/changes/agent-stored-credentials/design.md.
  # -----------------------------------------------------------------------

  # =========================================================================
  # 1. public.agent_secrets — metadata table
  # =========================================================================
  - changeSet:
      id: "027-agent-secrets-1"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              schemaName: public
              tableName: agent_secrets
      changes:
        - createTable:
            schemaName: public
            tableName: agent_secrets
            remarks: "Per-tenant agent-owned KV secrets metadata (ADR-0025)."
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_agent_secrets_tenant
                    references: public.tenants(id)
              - column:
                  name: agent_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_agent_secrets_agent
                    references: public.agents(id)
              - column:
                  name: name
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(256)
              - column:
                  name: size_bytes
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: public
            tableName: agent_secrets

  # --- 1b. Unique constraint uq_agent_secrets_name -------------------------
  - changeSet:
      id: "027-agent-secrets-1b"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: public
            tableName: agent_secrets
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE public.agent_secrets
                ADD CONSTRAINT uq_agent_secrets_name
                  UNIQUE (tenant_id, agent_id, name);
              COMMENT ON TABLE public.agent_secrets IS
                'Per-tenant agent-owned KV secrets metadata (ADR-0025).';
      rollback:
        - sql:
            sql: |
              ALTER TABLE public.agent_secrets
                DROP CONSTRAINT IF EXISTS uq_agent_secrets_name;

  # --- 2. Index on agent_secrets.tenant_id ---------------------------------
  - changeSet:
      id: "027-agent-secrets-2"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            indexExists:
              schemaName: public
              tableName: agent_secrets
              indexName: idx_agent_secrets_tenant
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX idx_agent_secrets_tenant
                ON public.agent_secrets (tenant_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS public.idx_agent_secrets_tenant;

  # --- 3. RLS on agent_secrets ---------------------------------------------
  - changeSet:
      id: "027-agent-secrets-3"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: public
            tableName: agent_secrets
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE public.agent_secrets ENABLE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON public.agent_secrets
                USING (
                  tenant_id = current_setting('app.current_tenant', true)::uuid
                  OR current_setting('app.platform_admin_view', true) = 'on'
                );
      rollback:
        - sql:
            sql: |
              DROP POLICY IF EXISTS tenant_isolation ON public.agent_secrets;
              ALTER TABLE public.agent_secrets DISABLE ROW LEVEL SECURITY;

  # --- 4. GRANT on agent_secrets -------------------------------------------
  - changeSet:
      id: "027-agent-secrets-4"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: public
            tableName: agent_secrets
      changes:
        - sql:
            splitStatements: false
            sql: |
              GRANT SELECT, INSERT, UPDATE, DELETE
                ON public.agent_secrets TO mintkey_app;
      rollback:
        - sql:
            sql: |
              REVOKE ALL ON public.agent_secrets FROM mintkey_app;

  # =========================================================================
  # 5. public.agent_secret_grants — operator-managed read grants
  # =========================================================================
  - changeSet:
      id: "027-agent-secret-grants-1"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              schemaName: public
              tableName: agent_secret_grants
      changes:
        - createTable:
            schemaName: public
            tableName: agent_secret_grants
            remarks: "Operator-managed read grants allowing one agent to read another agent's secret (ADR-0025)."
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_agent_secret_grants_tenant
                    references: public.tenants(id)
              - column:
                  name: secret_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_agent_secret_grants_secret
                    references: public.agent_secrets(id)
                    deleteCascade: true
              - column:
                  name: recipient_agent_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_agent_secret_grants_recipient
                    references: public.agents(id)
              - column:
                  name: created_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: public
            tableName: agent_secret_grants

  # --- 5b. Unique constraint uq_agent_secret_grants + comment --------------
  - changeSet:
      id: "027-agent-secret-grants-1b"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: public
            tableName: agent_secret_grants
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE public.agent_secret_grants
                ADD CONSTRAINT uq_agent_secret_grants
                  UNIQUE (tenant_id, secret_id, recipient_agent_id);
              COMMENT ON TABLE public.agent_secret_grants IS
                'Operator-managed read grants between agents for agent-owned secrets (ADR-0025).';
      rollback:
        - sql:
            sql: |
              ALTER TABLE public.agent_secret_grants
                DROP CONSTRAINT IF EXISTS uq_agent_secret_grants;

  # --- 6. Index on agent_secret_grants.tenant_id ---------------------------
  - changeSet:
      id: "027-agent-secret-grants-2"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            indexExists:
              schemaName: public
              tableName: agent_secret_grants
              indexName: idx_agent_secret_grants_tenant
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX idx_agent_secret_grants_tenant
                ON public.agent_secret_grants (tenant_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS public.idx_agent_secret_grants_tenant;

  # --- 7. RLS on agent_secret_grants ---------------------------------------
  - changeSet:
      id: "027-agent-secret-grants-3"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: public
            tableName: agent_secret_grants
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE public.agent_secret_grants ENABLE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON public.agent_secret_grants
                USING (
                  tenant_id = current_setting('app.current_tenant', true)::uuid
                  OR current_setting('app.platform_admin_view', true) = 'on'
                );
      rollback:
        - sql:
            sql: |
              DROP POLICY IF EXISTS tenant_isolation ON public.agent_secret_grants;
              ALTER TABLE public.agent_secret_grants DISABLE ROW LEVEL SECURITY;

  # --- 8. GRANT on agent_secret_grants -------------------------------------
  - changeSet:
      id: "027-agent-secret-grants-4"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: public
            tableName: agent_secret_grants
      changes:
        - sql:
            splitStatements: false
            sql: |
              GRANT SELECT, INSERT, UPDATE, DELETE
                ON public.agent_secret_grants TO mintkey_app;
      rollback:
        - sql:
            sql: |
              REVOKE ALL ON public.agent_secret_grants FROM mintkey_app;

  # =========================================================================
  # 9. vault.agent_secrets — encrypted blob store
  # =========================================================================
  - changeSet:
      id: "027-vault-agent-secrets-1"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              schemaName: vault
              tableName: agent_secrets
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE vault.agent_secrets (
                secret_id   UUID        PRIMARY KEY,
                tenant_id   UUID        NOT NULL,
                key_version INTEGER     NOT NULL,
                wrapped_dek BYTEA       NOT NULL,
                enc_payload BYTEA       NOT NULL,
                created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
                updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
              );
              COMMENT ON TABLE vault.agent_secrets IS
                'Encrypted blobs for agent-owned secrets; keyed by secret_id from public.agent_secrets (ADR-0025).';
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS vault.agent_secrets;

  # --- 10. Index on vault.agent_secrets.tenant_id --------------------------
  - changeSet:
      id: "027-vault-agent-secrets-2"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            indexExists:
              schemaName: vault
              tableName: agent_secrets
              indexName: idx_vault_agent_secrets_tenant
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE INDEX idx_vault_agent_secrets_tenant
                ON vault.agent_secrets (tenant_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS vault.idx_vault_agent_secrets_tenant;

  # --- 11. RLS on vault.agent_secrets --------------------------------------
  - changeSet:
      id: "027-vault-agent-secrets-3"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: vault
            tableName: agent_secrets
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vault.agent_secrets ENABLE ROW LEVEL SECURITY;
              CREATE POLICY tenant_isolation ON vault.agent_secrets
                USING (
                  tenant_id = current_setting('app.current_tenant', true)::uuid
                  OR current_setting('app.platform_admin_view', true) = 'on'
                );
      rollback:
        - sql:
            sql: |
              DROP POLICY IF EXISTS tenant_isolation ON vault.agent_secrets;
              ALTER TABLE vault.agent_secrets DISABLE ROW LEVEL SECURITY;

  # --- 12. GRANT on vault.agent_secrets ------------------------------------
  # Note: 018-vault-schema-6 sets DEFAULT PRIVILEGES so future vault tables
  # automatically inherit grants. The explicit GRANT below is a defensive
  # belt-and-suspenders for environments where the default privileges were
  # applied before this table was created.
  - changeSet:
      id: "027-vault-agent-secrets-4"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: vault
            tableName: agent_secrets
      changes:
        - sql:
            splitStatements: false
            sql: |
              GRANT SELECT, INSERT, UPDATE, DELETE
                ON vault.agent_secrets TO mintkey_app;
      rollback:
        - sql:
            sql: |
              REVOKE ALL ON vault.agent_secrets FROM mintkey_app;

  # =========================================================================
  # 13. agents.created_by — nullable attribution column (ADR-0025, D7)
  # =========================================================================
  - changeSet:
      id: "027-agents-created-by-1"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            columnExists:
              schemaName: public
              tableName: agents
              columnName: created_by
      changes:
        - addColumn:
            schemaName: public
            tableName: agents
            columns:
              - column:
                  name: created_by
                  type: UUID
                  remarks: "Operator who created this agent; NULL for pre-ADR-0025 agents. Added for future sharing tightening (ADR-0025 D7)."
      rollback:
        - dropColumn:
            schemaName: public
            tableName: agents
            columnName: created_by
