databaseChangeLog:
  # =========================================================================
  # 028-agent-secrets-created-by.yaml
  #
  # Adds `created_by` (UUID, nullable) to `public.agent_secrets` so that the
  # operator who provisions a secret on behalf of an agent can be attributed.
  #
  # ADR-0026 (operator-provisioned agent secrets) §D3.
  # Modelled exactly on changeset "027-agents-created-by-1" in
  # 027-agent-secrets.yaml.
  # =========================================================================

  - changeSet:
      id: "028-agent-secrets-created-by-1"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            columnExists:
              schemaName: public
              tableName: agent_secrets
              columnName: created_by
      changes:
        - addColumn:
            schemaName: public
            tableName: agent_secrets
            columns:
              - column:
                  name: created_by
                  type: UUID
                  remarks: "Operator who provisioned this secret on behalf of the agent; NULL for agent-created secrets pre-ADR-0026."
      rollback:
        - dropColumn:
            schemaName: public
            tableName: agent_secrets
            columnName: created_by
