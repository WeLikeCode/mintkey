databaseChangeLog:
  # -----------------------------------------------------------------------
  # 033-credential-target-backfill.yaml
  #
  # Fills the stored target of credentials created before the service's
  # base URL was recorded: every empty vault.credentials.target_url takes
  # the base_url of its service in the same tenant, for http(s) services
  # only (an SSH service's base_url stays out of an HTTP target).
  #
  # set_config('app.platform_admin_view', 'on', true) makes the statement
  # independent of whether the migration role owns the table: the table
  # has row-level security.
  #
  # Idempotent: the filled rows are no longer empty, so running it again
  # changes nothing. The rollback is a no-op: the filled value is the
  # service's own base URL.
  # -----------------------------------------------------------------------
  - changeSet:
      id: "033-credential-target-backfill-1"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          tableExists:
            schemaName: vault
            tableName: credentials
      changes:
        - sql:
            splitStatements: false
            sql: |
              SELECT set_config('app.platform_admin_view', 'on', true);

              UPDATE vault.credentials vc
              SET target_url = s.base_url
              FROM public.services s
              WHERE s.id = vc.service_id
                AND s.tenant_id = vc.tenant_id
                AND vc.target_url = ''
                AND s.base_url ~* '^https?://';
      rollback:
        - sql:
            sql: |
              SELECT 1;
