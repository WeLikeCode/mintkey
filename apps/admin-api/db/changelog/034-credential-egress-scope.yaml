databaseChangeLog:
  # -----------------------------------------------------------------------
  # 034-credential-egress-scope.yaml
  #
  # Adds the egress scope of a stored credential: `vault.credentials.
  # egress_scope`, either `any` (the proxy connects to whatever the stored
  # target names) or `public` (the proxy connects only to public network
  # addresses). The default `any` makes every existing row behave as before.
  #
  # See the proxy-public-egress specification.
  # -----------------------------------------------------------------------
  - changeSet:
      id: "034-credential-egress-scope-1"
      author: mintkey
      preConditions:
        - onFail: MARK_RAN
          not:
            columnExists:
              schemaName: vault
              tableName: credentials
              columnName: egress_scope
      changes:
        - sql:
            splitStatements: false
            sql: |
              ALTER TABLE vault.credentials
                ADD COLUMN egress_scope TEXT NOT NULL DEFAULT 'any'
                  CHECK (egress_scope IN ('any', 'public'));
      rollback:
        - sql:
            sql: |
              ALTER TABLE vault.credentials
                DROP COLUMN IF EXISTS egress_scope;
