[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admin-api"
version = "0.1.0-preview.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "grpcio>=1.80",
    "protobuf>=6.31",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "prometheus-client>=0.20",
    "asyncssh>=2.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/admin_api"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.7",
    "grpc-stubs>=1.53",
    "types-protobuf>=6.31",
    "types-authlib>=1.3",
    "types-PyYAML>=6.0",
    "hypothesis>=6.130",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
# Exclude auto-generated protobuf files — same policy as mypy below.
exclude = [
    "src/admin_api/services/vault_pb2.py",
    "src/admin_api/services/vault_pb2_grpc.py",
]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = [
    "src/admin_api/services/vault_pb2\\.py$",
    "src/admin_api/services/vault_pb2_grpc\\.py$",
]

[[tool.mypy.overrides]]
module = "mintkey_models.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncssh.*"
ignore_missing_imports = true
