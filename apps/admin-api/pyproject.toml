[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admin-api"
version = "0.1.0-preview.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "asyncpg>=0.32.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.9.0",
    "joserfc>=1.6.8",
    "structlog>=26.1.0",
    "httpx>=0.27",
    "psycopg2-binary>=2.9.13",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.29",
    "prometheus-client>=0.26.0",
    "asyncssh>=2.24.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/admin_api"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "mypy>=2.4.0",
    "testcontainers[postgres]>=4.15.0",
    "grpc-stubs>=1.53.0.6",
    "types-protobuf>=7.35.1.20260906",
    "types-authlib>=1.8.0.20260911",
    "types-PyYAML>=6.0",
    "hypothesis>=6.169.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
# Exclude auto-generated protobuf files — same policy as mypy below.
exclude = [
    "src/admin_api/services/vault_pb2.py",
    "src/admin_api/services/vault_pb2_grpc.py",
]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = [
    "src/admin_api/services/vault_pb2\\.py$",
    "src/admin_api/services/vault_pb2_grpc\\.py$",
]

[[tool.mypy.overrides]]
module = "mintkey_models.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncssh.*"
ignore_missing_imports = true
