templates:

  # ── Email service templates (kind: email_service) ─────────────────────────
  # These use imap_host/port + smtp_host/port instead of a single base_url.
  # Created via POST /v1/tenants/{tid}/email-services/from-template.

  - template_id: email_gmail_oauth2
    kind: email_service
    name: gmail
    display_name: Gmail (OAuth2)
    description: "Gmail IMAP+SMTP via OAuth2. Refresh-token stored encrypted in vault."
    category: email
    provider: gmail
    imap_host: imap.gmail.com
    imap_port: 993
    smtp_host: smtp.gmail.com
    smtp_port: 465
    auth_scheme: email_oauth2
    config_notes: |
      Requires Gmail OAuth2 client_id/_secret configured on admin-api env
      (MINTKEY_OAUTH2_GMAIL_CLIENT_ID / _SECRET). Operator completes auth by
      clicking "Authorize Gmail" → consent → callback. Refresh-token stored
      encrypted in vault; access-token cached 90% of TTL by email-proxy.
    version: 1

  - template_id: email_outlook_oauth2
    kind: email_service
    name: outlook
    display_name: Outlook / Office 365 (OAuth2)
    description: "Outlook / Office 365 IMAP+SMTP via OAuth2."
    category: email
    provider: outlook
    imap_host: outlook.office365.com
    imap_port: 993
    smtp_host: smtp.office365.com
    smtp_port: 587
    auth_scheme: email_oauth2
    config_notes: |
      Requires Outlook OAuth2 client_id/_secret on admin-api env
      (MINTKEY_OAUTH2_OUTLOOK_CLIENT_ID / _SECRET). Same flow as Gmail.
    version: 1

  - template_id: email_icloud_app_password
    kind: email_service
    name: icloud
    display_name: iCloud Mail (App Password)
    description: "iCloud Mail IMAP+SMTP via Apple app-specific password."
    category: email
    provider: generic
    imap_host: imap.mail.me.com
    imap_port: 993
    smtp_host: smtp.mail.me.com
    smtp_port: 587
    auth_scheme: email_app_password
    config_notes: |
      iCloud Mail requires an app-specific password (Apple ID → Security →
      App-Specific Passwords). Standard email + password do NOT work — Apple
      blocks third-party access without an app password.
    version: 1

  - template_id: email_generic_imap_smtp
    kind: email_service
    name: generic_imap_smtp
    display_name: Generic IMAP + SMTP (Password)
    description: "Any IMAP+SMTP provider that supports username+password auth."
    category: email
    provider: generic
    imap_host: ""
    imap_port: 993
    smtp_host: ""
    smtp_port: 587
    auth_scheme: email_password
    config_notes: |
      Use for any IMAP+SMTP provider that supports username+password auth
      (Fastmail, Zoho, self-hosted, etc.). Operator fills imap_host and
      smtp_host; defaults to ports 993 (IMAPS) and 587 (SMTP STARTTLS).
    version: 1

  # ── HTTP service templates (kind: http_service, default) ──────────────────

  - template_id: gitlab
    name: gitlab
    display_name: GitLab
    description: "CI/CD pipelines, repository management, merge requests, and project administration."
    base_url: https://gitlab.com/api/v4
    auth_type: bearer_token
    openapi_spec_url: https://gitlab.com/gitlab-org/gitlab/-/raw/master/doc/api/openapi/openapi.yaml
    category: ci_cd
    version: "1.0.0"
    config_notes: null
    credential_hint:
      field: token
      help: "Personal Access Token or Project/Group Access Token"
      format: "glpat-..."
    test_path: /version

  - template_id: apple-app-store-connect
    name: apple-app-store-connect
    display_name: Apple App Store Connect
    description: "App management, TestFlight, provisioning profiles, and sales reporting. Mintkey signs the required ES256 JWT (aud=appstoreconnect-v1, 19m TTL) from your .p8 key on every request — no manual rotation."
    base_url: https://api.appstoreconnect.apple.com/v1
    auth_type: apple_jwt
    openapi_spec_url: https://developer.apple.com/sample-code/app-store-connect/app-store-connect-openapi-specification.zip
    category: app_store
    version: "1.0.0"
    config_notes: "Paste the .p8 PKCS#8 PEM private key, the Key ID (kid) and the Issuer ID (iss) from App Store Connect. Mintkey signs an ES256 JWT (aud=appstoreconnect-v1) per request — there is no token to refresh manually."
    credential_hint:
      p8_key_pem: "-----BEGIN PRIVATE KEY-----\n...your .p8 contents...\n-----END PRIVATE KEY-----"
      key_id: "TNRVKBLCWWTH"
      issuer_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    test_path: /apps

  - template_id: google-play-developer
    name: google-play-developer
    display_name: Google Play Developer API
    description: "App publishing, in-app purchases, subscriptions, and review management."
    base_url: https://androidpublisher.googleapis.com
    auth_type: google_service_account
    openapi_spec_url: https://androidpublisher.googleapis.com/$discovery/rest?version=v3
    category: app_store
    version: "1.0.0"
    config_notes: "Operator uploads a service account JSON key; Vault Adapter auto-rotates OAuth2 access tokens (scope: androidpublisher) — no manual token management required."
    credential_hint:
      field: service_account_json
      help: "Paste the full service account JSON key file. Mintkey auto-rotates access tokens for scope https://www.googleapis.com/auth/androidpublisher."
      format: 'Google service account JSON (see GCP Console → IAM → Service Accounts → Keys)'
      scope_default: "https://www.googleapis.com/auth/androidpublisher"
    test_path: /androidpublisher/v3/applications

  - template_id: azure-devops
    name: azure-devops
    display_name: Azure DevOps
    description: "CI/CD pipelines, Git repositories, work items, and artifact management."
    base_url: https://dev.azure.com
    auth_type: bearer_token
    openapi_spec_url: https://github.com/Azure/azure-rest-api-specs/tree/main/specification/devops
    category: ci_cd
    version: "1.0.0"
    config_notes: "The base URL requires an organization name appended (e.g., https://dev.azure.com/{organization})."
    credential_hint:
      field: token
      help: "Personal Access Token (PAT) with appropriate scopes"
      format: "Base64-encoded PAT"
    test_path: /_apis/projects?api-version=7.0

  - template_id: heroku
    name: heroku
    display_name: Heroku
    description: "App deployment, dynos, add-ons, and platform configuration."
    base_url: https://api.heroku.com
    auth_type: bearer_token
    openapi_spec_url: https://devcenter.heroku.com/articles/platform-api-reference
    category: platform
    version: "1.0.0"
    config_notes: "The API uses JSON Schema (not OpenAPI) as its machine-readable spec format, and requires Accept: application/vnd.heroku+json; version=3 header."
    credential_hint:
      field: token
      help: "Heroku API Key or OAuth token"
      format: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    test_path: /account

  - template_id: brave-search
    name: brave-search
    display_name: Brave Search
    description: "Web search, news search, image search, and AI-powered summarization."
    base_url: https://api.search.brave.com/res/v1
    auth_type: api_key_header
    openapi_spec_url: https://api.search.brave.com/app/documentation/web-search/get-started
    category: search
    version: "1.0.0"
    config_notes: "The API key is passed via the X-Subscription-Token header."
    credential_hint:
      field: api_key
      help: "Brave Search API subscription token"
      format: "BSA..."
    test_path: /web/search?q=test&count=1

  - template_id: sendgrid
    name: sendgrid
    display_name: SendGrid
    description: "Email sending, templates, contacts, and analytics."
    base_url: https://api.sendgrid.com/v3
    auth_type: bearer_token
    openapi_spec_url: https://raw.githubusercontent.com/sendgrid/sendgrid-oai/main/oai.json
    category: communications
    version: "1.0.0"
    config_notes: null
    credential_hint:
      field: api_key
      help: "SendGrid API Key"
      format: "SG...."
    test_path: /user/profile

  - template_id: twilio
    name: twilio
    display_name: Twilio
    description: "SMS, voice calls, video, and messaging APIs."
    base_url: https://api.twilio.com/2010-04-01
    auth_type: basic_auth
    openapi_spec_url: https://github.com/twilio/twilio-oai/tree/main/spec/json
    category: communications
    version: "1.0.0"
    config_notes: "Authentication uses Account SID as username and Auth Token as password (HTTP Basic Auth)."
    credential_hint:
      field: credentials
      help: "Account SID:Auth Token (colon-separated)"
      format: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    test_path: /Accounts.json

  - template_id: stripe
    name: stripe
    display_name: Stripe
    description: "Payments, subscriptions, invoicing, and financial reporting."
    base_url: https://api.stripe.com/v1
    auth_type: bearer_token
    openapi_spec_url: https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.json
    category: payments
    version: "1.0.0"
    config_notes: null
    credential_hint:
      field: secret_key
      help: "Use a restricted key for production; test keys start with sk_test_"
      format: "sk_live_... or sk_test_..."
    test_path: /charges?limit=1

  - template_id: cloudflare
    name: cloudflare
    display_name: Cloudflare
    description: "DNS management, CDN configuration, security rules, and Workers deployment."
    base_url: https://api.cloudflare.com/client/v4
    auth_type: bearer_token
    openapi_spec_url: https://github.com/cloudflare/api-schemas/tree/main/openapi.json
    category: infrastructure
    version: "1.0.0"
    config_notes: null
    credential_hint:
      field: token
      help: "Cloudflare API Token (not Global API Key)"
      format: "Bearer token from dashboard"
    test_path: /user/tokens/verify

  - template_id: datadog
    name: datadog
    display_name: Datadog
    description: "Metrics, traces, logs, dashboards, and alerting."
    base_url: https://api.datadoghq.com/api/v2
    auth_type: api_key_header
    openapi_spec_url: https://docs.datadoghq.com/api/latest/
    category: observability
    version: "1.0.0"
    config_notes: "Authentication requires both DD-API-KEY and DD-APPLICATION-KEY headers, and the base URL varies by region (e.g., api.us5.datadoghq.com)."
    credential_hint:
      field: api_key
      help: "DD-API-KEY and DD-APPLICATION-KEY (comma-separated or structured)"
      format: "api_key,application_key"
    test_path: /api/v2/validate

  - template_id: pagerduty
    name: pagerduty
    display_name: PagerDuty
    description: "Incident management, on-call scheduling, escalation policies, and service health."
    base_url: https://api.pagerduty.com
    auth_type: bearer_token
    openapi_spec_url: https://github.com/PagerDuty/api-schema/tree/main/reference
    category: incident_management
    version: "1.0.0"
    config_notes: null
    credential_hint:
      field: api_key
      help: "PagerDuty REST API Key (v2)"
      format: "u+xxxxxxxxxxxxxxxx"
    test_path: /abilities

  - template_id: spotus-dashboard-api
    name: SpotUs Dashboard API
    display_name: SpotUs Dashboard API
    description: "SpotUs Dashboard API (staging) — user administration, reporting, and identity management via username/password JWT authentication."
    base_url: https://dashboard-api-ps-stag.azurewebsites.net
    auth_type: oauth2_password_grant
    openapi_spec_url: https://dashboard-api-ps-stag.azurewebsites.net/swagger/v1/swagger.json
    category: platform
    version: "1.0.0"
    config_notes: "Points at the staging deployment. The token endpoint accepts {userName, password} as form/JSON body and returns a JWT via token_response_path. The proxy automatically exchanges credentials for a bearer token on each request."
    credential_hint:
      token_url: https://dashboard-api-ps-stag.azurewebsites.net/api/v1/Token
      credential_fields:
        userName: "(your userName)"
        password: "(your password)"
      token_response_path: "$.data.token"
    test_path: /api/v1/Identity/me

  - template_id: github
    name: github
    display_name: GitHub REST API
    description: "GitHub v3 REST API — issues, repos, PRs, workflows. Use a Personal Access Token (classic or fine-grained)."
    base_url: https://api.github.com
    auth_type: bearer_token
    openapi_spec_url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
    category: developer_tools
    version: "1.0.0"
    config_notes: null
    credential_hint:
      field: token
      help: "Create a fine-grained PAT at https://github.com/settings/tokens?type=beta"
      format: "ghp_... or github_pat_..."
    test_path: /user

  - template_id: openai
    name: openai
    display_name: OpenAI API
    description: "OpenAI chat completions, embeddings, and assistants API."
    base_url: https://api.openai.com/v1
    auth_type: bearer_token
    openapi_spec_url: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
    category: ai
    version: "1.0.0"
    config_notes: null
    credential_hint:
      field: token
      help: "Create an API key at https://platform.openai.com/api-keys"
      format: "sk-..."
    test_path: /models

  - template_id: ssh-bastion-key
    name: ssh-bastion-key
    display_name: SSH Bastion (key-based)
    description: "Generic SSH host accessed via Mintkey bastion using a private key (recommended)."
    base_url: ssh://CHANGE-ME-HOST:22
    auth_type: ssh_private_key
    openapi_spec_url: null
    category: infrastructure
    version: "1.0.0"
    config_notes: "Replace base_url with ssh://your-host:port. Provide private key + username + target_address when adding the credential."
    credential_hint:
      field: private_key_pem
      help: "Paste an OpenSSH private key (BEGIN OPENSSH PRIVATE KEY)."
      format: "-----BEGIN OPENSSH PRIVATE KEY-----\n..."
    test_path: /

  - template_id: ssh-bastion-password
    name: ssh-bastion-password
    display_name: SSH Bastion (username + password)
    description: "Generic SSH host accessed via Mintkey bastion using username + password. Prefer key-based when possible."
    base_url: ssh://CHANGE-ME-HOST:22
    auth_type: ssh_password
    openapi_spec_url: null
    category: infrastructure
    version: "1.0.0"
    config_notes: "Replace base_url with ssh://your-host:port. Password is stored encrypted in vault; rotated only on operator update."
    credential_hint:
      field: password
      help: "Provide username + password + target_address when adding the credential."
      format: "<password>"
    test_path: /

  - template_id: slack
    name: slack
    display_name: Slack Web API
    description: "Slack messaging and workspace API. Use a Bot User OAuth Token from a Slack app."
    base_url: https://slack.com/api
    auth_type: bearer_token
    openapi_spec_url: null
    category: communication
    version: "1.0.0"
    config_notes: "Install a Slack app at https://api.slack.com/apps and copy the Bot User OAuth Token."
    credential_hint:
      field: token
      help: "Install a Slack app at https://api.slack.com/apps and copy the Bot User OAuth Token"
      format: "xoxb-..."
    test_path: /api.test

  - template_id: tailscale
    name: tailscale
    display_name: Tailscale
    description: "Tailscale mesh-VPN control API — list/authorize/remove devices, manage ACL tags, inspect DNS settings, and manage tailnet auth keys. Uses a Tailscale API access token as a bearer credential."
    base_url: https://api.tailscale.com
    auth_type: bearer_token
    openapi_spec_url: https://tailscale.com/api
    category: networking
    version: "1.0.0"
    config_notes: "Paste a Tailscale API access token (admin console → Settings → Keys → Generate access token). Tokens expire in 1–90 days — rotate the vault credential before expiry. Alternatively an OAuth2 client-credentials access token works as a bearer, but Mintkey does not yet perform the token exchange (OAuth support is a follow-up); for now supply a personal access token. The - in test_path resolves to the token's default tailnet."
    credential_hint:
      field: token
      help: "Tailscale API access token from the admin console Keys page. Needs at least device-read scope (e.g. devices:core) for the validation check to pass."
      format: "tskey-api-... (personal access token) or an OAuth2 access token"
    test_path: /api/v2/tailnet/-/devices
