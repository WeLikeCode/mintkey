# Placeholder nginx config for admin-ui until AdminJS Dockerfile is implemented (T-1.3.x).
# Serves a minimal health endpoint on port 8081.
server {
    listen 8081;
    server_name _;

    location /health {
        return 200 '{"status":"ok","service":"admin-ui-placeholder"}';
        add_header Content-Type application/json;
    }

    location / {
        return 200 '{"status":"ok","note":"admin-ui placeholder"}';
        add_header Content-Type application/json;
    }
}
