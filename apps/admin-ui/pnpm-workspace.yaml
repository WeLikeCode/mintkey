# Single-package "workspace" — required for pnpm v9+ to accept this file
# (newer pnpm versions error with "packages field missing or empty" if absent
# even though we have no sub-packages).
packages:
  - "."

allowBuilds:
  esbuild: true

overrides:
  "@tiptap/core": "2.27.2"
  "@tiptap/pm": "2.27.2"
  "@tiptap/extension-link": "2.27.2"
  "tinymce": "^7.0.0"
  "esbuild": "^0.28.0"
  "vite": "^6.4.2"
  "i18next-http-backend": "^3.0.5"
  "picomatch": "^4.0.4"
  "uuid": "^11.1.1"
  "qs": "^6.15.2"
