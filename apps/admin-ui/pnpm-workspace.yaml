# Single-package "workspace" — required for pnpm v9+ to accept this file
# (newer pnpm versions error with "packages field missing or empty" if absent
# even though we have no sub-packages).
packages:
  - "."

allowBuilds:
  esbuild: true

overrides:
  "@tiptap/core": "2.27.2"
  "@tiptap/pm": "2.27.2"
  "@tiptap/extension-link": "2.27.2"
  "tinymce": "^7.0.0"
  "esbuild": "^0.28.0"
  "vite": "^6.4.2"
  "i18next-http-backend": "^3.0.5"
  "picomatch": "^4.0.4"
  "uuid": "^14.0.0"
  "qs": "^6.15.2"
  # 2026-10 Trivy HIGH/CRITICAL (container-scan): the first fixed release of each line in the image's tree
  "axios": "^1.20.0"
  "brace-expansion@^2": "^2.1.6"
  "brace-expansion@^5": "^5.0.11"
  "browserslist": "^4.28.7"
  "immutable@^4": "^4.3.9"
  "linkify-it": "^5.0.2"
  "nanoid@^3": "^3.3.18"
  "postcss": "^8.5.18"
  "prosemirror-view": "^1.42.3"
  "proxy-addr": "^2.0.8"
  "source-map-js": "^1.2.2"
  "tinypool": "^2.1.2"
  "undici@^6": "^6.28.1"
  "undici@^7": "^7.29.1"
