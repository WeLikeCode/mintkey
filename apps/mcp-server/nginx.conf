# Placeholder nginx config for mcp-server until mcp-server Dockerfile is implemented (T-1.5.x).
# Serves a minimal health endpoint on port 8082.
server {
    listen 8082;
    server_name _;

    location /health {
        return 200 '{"status":"ok","service":"mcp-server-placeholder"}';
        add_header Content-Type application/json;
    }

    location / {
        return 200 '{"status":"ok","note":"mcp-server placeholder"}';
        add_header Content-Type application/json;
    }
}
