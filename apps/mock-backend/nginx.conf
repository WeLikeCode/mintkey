# Placeholder nginx config for mock-backend until FastAPI implementation is done (T-1.9.x / design §12).
# Serves a minimal health endpoint on port 8999.
server {
    listen 8999;
    server_name _;

    location /health {
        return 200 '{"status":"ok","service":"mock-backend-placeholder"}';
        add_header Content-Type application/json;
    }

    location / {
        return 200 '{"status":"ok","note":"mock-backend placeholder"}';
        add_header Content-Type application/json;
    }
}
