{{- if .Values.observability.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mintkey.fullname" . }}-prometheus-alerts
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  alert_rules.yml: |
    groups:
      - name: mintkey.security
        rules:
          - alert: AuditChainTampered
            expr: mintkey_audit_chain_tamper_detected > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Audit chain tamper detected"
              description: "mintkey_audit_chain_tamper_detected is non-zero — hash chain broken."

          - alert: JwksEndpointDown
            expr: up{job="broker"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Broker JWKS endpoint unreachable"
              description: "The broker (JWKS publisher) has been down for >2m."

          - alert: VaultAdapterGrpcErrors
            expr: rate(mintkey_vault_adapter_requests_total[5m]) == 0 and up{job="vault-adapter"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Vault Adapter gRPC receiving no requests"
              description: "vault-adapter is up but handling zero requests for 5m — possible gRPC error storm."

          - alert: ChangeChannelSubscriberLag
            expr: mintkey_change_subscriber_lag_seconds > 30
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Change-channel subscriber lag exceeds 30s"
              description: "The LISTEN/NOTIFY subscriber is {{ "{{ $value }}" }}s behind — cache may serve stale data."

          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Disk space below 10%"
              description: "Root filesystem is {{ "{{ $value | humanizePercentage }}" }} full."

          - alert: BootstrapSecretsMissing
            expr: mintkey_bootstrap_secrets_present == 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "Bootstrap secrets directory missing or empty"
              description: "admin-ui cannot sign requests; the bootstrap-secrets volume may not be mounted."

          - alert: OtelCollectorDroppingSpans
            expr: rate(otelcol_processor_dropped_spans_total[5m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "OTel collector is dropping spans"
              description: "{{ "{{ $value }}" }} spans/s dropped — collector may be overloaded or exporter is failing."

          - alert: OperatorLoginFailureSpike
            expr: rate(mintkey_operator_login_failures_total[5m]) > 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Operator login failure spike"
              description: "{{ "{{ $value }}" }} login failures/s over the last 5m — possible credential stuffing."

      - name: mintkey.auditq
        rules:
          - alert: AuditDeadLetterGrowing
            expr: rate(auditq_dead_letter_events_total[5m]) > 0.1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Audit dead-letter queue growing on {{ "{{ $labels.service }}" }}"
              description: >
                auditq_dead_letter_events_total is growing at {{ "{{ $value | humanize }}" }} events/s
                (threshold: >0.1/s) for 10 minutes on service {{ "{{ $labels.service }}" }}.
                Check /var/lib/mintkey/*.wal.dead and admin-api reachability.

          - alert: AuditWALSizeHigh
            expr: auditq_wal_size_bytes > 104857600
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Audit WAL size high on {{ "{{ $labels.service }}" }}"
              description: >
                auditq_wal_size_bytes is {{ "{{ $value | humanize1024 }}" }}B (threshold: >100 MiB)
                for 5 minutes on service {{ "{{ $labels.service }}" }}.
                Compaction may be stalled or drain is falling behind.

      - name: mintkey.memory
        rules:
          - alert: MintkeyContainerMemHigh
            expr: >
              (container_memory_working_set_bytes{name=~"mintkey.*"}
               / container_spec_memory_limit_bytes{name=~"mintkey.*"}) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ "{{ $labels.name }}" }} memory usage >85% of limit"
              description: "Working set is {{ "{{ $value | humanizePercentage }}" }} of the container memory limit."

      - name: mintkey.budget
        rules:
          - alert: BudgetNearExhaustion
            expr: mintkey_budget_used / mintkey_budget_ceiling > 0.9
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Agent budget > 90% for {{ "{{ $labels.agent_id }}" }} on {{ "{{ $labels.service_id }}" }}"
{{- end }}
