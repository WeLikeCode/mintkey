{{- $mcpScheme := ternary "https" "http" .Values.ingress.mcpServer.tls -}}
{{- $mcpPublicUrl := ternary (printf "%s://%s" $mcpScheme .Values.ingress.mcpServer.host) "" (ne .Values.ingress.mcpServer.host "") -}}
{{- $kongScheme := ternary "https" "http" .Values.ingress.kongProxy.tls -}}
{{- $kongPublicUrl := ternary (printf "%s://%s" $kongScheme .Values.ingress.kongProxy.host) "" (ne .Values.ingress.kongProxy.host "") -}}
{{- $adminApiScheme := ternary "https" "http" .Values.ingress.adminApi.tls -}}
{{- $adminApiPublicUrl := ternary (printf "%s://%s" $adminApiScheme .Values.ingress.adminApi.host) "" (ne .Values.ingress.adminApi.host "") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mintkey.fullname" . }}-admin-ui
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
spec:
  replicas: {{ .Values.adminUi.replicas }}
  selector:
    matchLabels:
      {{- include "mintkey.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin-ui
  template:
    metadata:
      labels:
        {{- include "mintkey.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin-ui
    spec:
      serviceAccountName: {{ include "mintkey.serviceAccountName" . }}
      {{- include "mintkey.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-admin-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://{{ include "mintkey.fullname" . }}-admin-api:8080/v1/health > /dev/null 2>&1; do
                echo "Waiting for admin-api..."
                sleep 5
              done
      containers:
        - name: admin-ui
          image: {{ include "mintkey.image" (dict "image" .Values.adminUi.image "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: ADMIN_API_URL
              value: http://{{ include "mintkey.fullname" . }}-admin-api:8080
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SESSION_SECRET
            - name: PORT
              value: "8081"
            - name: ADMIN_EMAIL
              value: admin@mintkey.internal
            - name: ADMIN_PASSWORD_FILE
              value: /run/secrets/mintkey/bootstrap-secrets/admin_password
            - name: MINTKEY_BOOTSTRAP_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINTKEY_BOOTSTRAP_KEK
            - name: ADMIN_UI_PRIVATE_KEY_PATH
              value: /run/secrets/mintkey/bootstrap-secrets/admin_ui_private.pem
            - name: MINTKEY_MCP_PUBLIC_URL
              value: {{ $mcpPublicUrl | quote }}
            - name: MINTKEY_PROXY_PUBLIC_URL
              value: {{ $kongPublicUrl | quote }}
            - name: MINTKEY_ADMIN_API_URL
              value: http://{{ include "mintkey.fullname" . }}-admin-api:8080
            - name: MINTKEY_ADMIN_API_PUBLIC_URL
              value: {{ $adminApiPublicUrl | quote }}
          volumeMounts:
            - name: bootstrap-secrets
              mountPath: /run/secrets/mintkey/bootstrap-secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.adminUi.resources | nindent 12 }}
      volumes:
        - name: bootstrap-secrets
          persistentVolumeClaim:
            claimName: {{ include "mintkey.fullname" . }}-bootstrap-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mintkey.fullname" . }}-admin-ui
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
spec:
  type: ClusterIP
  selector:
    {{- include "mintkey.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin-ui
  ports:
    - name: http
      port: 8081
      targetPort: 8081
