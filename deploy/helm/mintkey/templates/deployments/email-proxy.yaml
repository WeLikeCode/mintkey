apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mintkey.fullname" . }}-email-proxy
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-proxy
spec:
  replicas: {{ .Values.emailProxy.replicas }}
  selector:
    matchLabels:
      {{- include "mintkey.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: email-proxy
  template:
    metadata:
      labels:
        {{- include "mintkey.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: email-proxy
    spec:
      serviceAccountName: {{ include "mintkey.serviceAccountName" . }}
      {{- include "mintkey.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-vault-adapter
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mintkey.fullname" . }}-vault-adapter 8084; do
                echo "Waiting for vault-adapter..."
                sleep 2
              done
        - name: wait-for-broker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://{{ include "mintkey.fullname" . }}-broker:8083/v1/health > /dev/null 2>&1; do
                echo "Waiting for broker..."
                sleep 5
              done
        - name: wait-for-admin-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://{{ include "mintkey.fullname" . }}-admin-api:8080/v1/health > /dev/null 2>&1; do
                echo "Waiting for admin-api..."
                sleep 5
              done
      containers:
        - name: email-proxy
          image: {{ include "mintkey.image" (dict "image" .Values.emailProxy.image "root" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MINTKEY_VAULT_EMAIL_PROXY_IDENTITY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINTKEY_VAULT_EMAIL_PROXY_IDENTITY_ID
            - name: MINTKEY_VAULT_EMAIL_PROXY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINTKEY_VAULT_EMAIL_PROXY_TOKEN
            - name: MINTKEY_EMAIL_PROXY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINTKEY_EMAIL_PROXY_SERVICE_TOKEN
            - name: MINTKEY_BROKER_JWKS_URL
              value: http://{{ include "mintkey.fullname" . }}-broker:8083/.well-known/jwks.json
            - name: MINTKEY_VAULT_GRPC_ADDR
              value: {{ include "mintkey.fullname" . }}-vault-adapter:8084
            - name: MINTKEY_ADMIN_API_INTERNAL_URL
              value: http://{{ include "mintkey.fullname" . }}-admin-api:8080
            - name: LOG_LEVEL
              value: info
            {{- include "mintkey.extraEnv" (dict "root" . "service" .Values.emailProxy) | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.emailProxy.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mintkey.fullname" . }}-email-proxy
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: email-proxy
spec:
  type: ClusterIP
  selector:
    {{- include "mintkey.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: email-proxy
  ports:
    - name: http
      port: 8088
      targetPort: 8088
    - name: metrics
      port: 8090
      targetPort: 8090
