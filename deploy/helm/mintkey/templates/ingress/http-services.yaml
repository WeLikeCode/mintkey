{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.adminApi.host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mintkey.fullname" . }}-admin-api
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin-api
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.adminApi.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.adminApi.host }}
      secretName: {{ .Values.ingress.adminApi.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.adminApi.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mintkey.fullname" . }}-admin-api
                port:
                  number: 8080
{{- end }}
