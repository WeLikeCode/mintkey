apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mintkey.fullname" . }}-liquibase
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: liquibase
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "mintkey.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: liquibase
    spec:
      serviceAccountName: {{ include "mintkey.serviceAccountName" . }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mintkey.fullname" . }}-postgres 5432; do
                echo "Waiting for postgres…"
                sleep 2
              done
      containers:
        - name: liquibase
          image: liquibase/liquibase:4.27.0@sha256:141a9fb5df99e43be49e507dc1892a65cd7b93c9e662c4212e834468df959983
          args:
            - --url=jdbc:postgresql://{{ include "mintkey.fullname" . }}-postgres:5432/mintkey
            - --username=mintkey_migrate
            - --changeLogFile=changelog/db.changelog-master.yaml
            - -Ddb_app_password=$(MINTKEY_DB_APP_PASSWORD)
            - -Ddb_subscriber_password=$(MINTKEY_DB_SUBSCRIBER_PASSWORD)
            - update
          env:
            - name: JAVA_OPTS
              value: ""
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_MIGRATE_PASSWORD
            - name: MINTKEY_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINTKEY_DB_APP_PASSWORD
            - name: MINTKEY_DB_SUBSCRIBER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINTKEY_DB_SUBSCRIBER_PASSWORD
          volumeMounts:
            - name: changelog
              mountPath: /liquibase/changelog
      volumes:
        - name: changelog
          configMap:
            name: {{ include "mintkey.fullname" . }}-liquibase-changelog
