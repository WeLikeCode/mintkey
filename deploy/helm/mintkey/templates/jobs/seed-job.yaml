{{- $adminApiScheme := ternary "https" "http" .Values.ingress.adminApi.tls -}}
{{- $adminApiUrl := ternary (printf "%s://%s" $adminApiScheme .Values.ingress.adminApi.host) "" (ne .Values.ingress.adminApi.host "") -}}
{{- $grafanaScheme := ternary "https" "http" .Values.ingress.grafana.tls -}}
{{- $grafanaUrl := ternary (printf "%s://%s" $grafanaScheme .Values.ingress.grafana.host) "" (and .Values.observability.enabled (ne .Values.ingress.grafana.host "")) -}}
{{- $jaegerScheme := ternary "https" "http" .Values.ingress.jaegerAuth.tls -}}
{{- $jaegerUrl := ternary (printf "%s://%s" $jaegerScheme .Values.ingress.jaegerAuth.host) "" (and .Values.observability.enabled (ne .Values.ingress.jaegerAuth.host "")) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mintkey.fullname" . }}-seed-job
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed-job
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "mintkey.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seed-job
    spec:
      serviceAccountName: {{ include "mintkey.serviceAccountName" . }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-liquibase
          image: postgres:16
          command:
            - sh
            - -c
            - |
              until psql "postgres://mintkey_migrate:$PGPASSWORD@{{ include "mintkey.fullname" . }}-postgres:5432/mintkey" \
                    -c "SELECT 1 FROM databasechangelog LIMIT 1" 2>/dev/null; do
                echo "Waiting for Liquibase migrations…"
                sleep 5
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_MIGRATE_PASSWORD
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mintkey.fullname" . }}-keycloak 8443; do
                echo "Waiting for Keycloak…"
                sleep 2
              done
      containers:
        - name: seed-job
          image: {{ .Values.global.imageRegistry }}/mintkey-seed-job:{{ .Values.global.imageTag }}
          env:
            - name: PGHOST
              value: {{ include "mintkey.fullname" . }}-postgres
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: mintkey
            - name: PGUSER
              value: mintkey_migrate
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_MIGRATE_PASSWORD
            - name: BOOTSTRAP_SECRETS_DIR
              value: /run/secrets/mintkey/bootstrap-secrets
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: MINTKEY_KEYCLOAK_INTERNAL_URL
              value: http://{{ include "mintkey.fullname" . }}-keycloak:8443
            - name: MINTKEY_BOOTSTRAP_KEK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MINTKEY_BOOTSTRAP_KEK
            - name: HOST_BOOTSTRAP_SECRETS_DIR
              value: ""
            - name: MINTKEY_ADMIN_API_PUBLIC_URL
              value: {{ $adminApiUrl | quote }}
            {{- if .Values.observability.enabled }}
            - name: MINTKEY_GRAFANA_PUBLIC_URL
              value: {{ $grafanaUrl | quote }}
            - name: MINTKEY_JAEGER_PUBLIC_URL
              value: {{ $jaegerUrl | quote }}
            {{- end }}
          volumeMounts:
            - name: bootstrap-secrets
              mountPath: /run/secrets/mintkey/bootstrap-secrets
      volumes:
        - name: bootstrap-secrets
          persistentVolumeClaim:
            claimName: {{ include "mintkey.fullname" . }}-bootstrap-secrets
