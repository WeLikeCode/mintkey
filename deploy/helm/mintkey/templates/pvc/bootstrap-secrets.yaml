apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mintkey.fullname" . }}-bootstrap-secrets
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap-secrets
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.bootstrapSecretsStorageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.bootstrapSecretsStorage }}
