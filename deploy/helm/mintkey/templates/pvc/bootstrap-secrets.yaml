apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mintkey.fullname" . }}-bootstrap-secrets
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap-secrets
  # Regular resource (not a hook): the seed-job that populates it is a
  # post-install hook, so the PVC only needs to exist in the main phase — where
  # the app pods also mount it. (Was a pre-install hook back when seed-job was
  # pre-install; as an ArgoCD PreSync hook that would be destructively
  # re-created every sync.) RWX so seed-job + admin-api/admin-ui share it.
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.bootstrapSecretsStorageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.bootstrapSecretsStorage }}
