apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mintkey.fullname" . }}-keycloak
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  serviceName: {{ include "mintkey.fullname" . }}-keycloak
  replicas: 1
  selector:
    matchLabels:
      {{- include "mintkey.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keycloak
  template:
    metadata:
      labels:
        {{- include "mintkey.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      serviceAccountName: {{ include "mintkey.serviceAccountName" . }}
      {{- include "mintkey.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "mintkey.fullname" . }}-postgres 5432; do
                echo "Waiting for postgres..."
                sleep 2
              done
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args:
            {{- if .Values.ingress.keycloak.host }}
            - start          # production mode — required for a fixed public hostname
            {{- else }}
            - start-dev
            {{- end }}
            - --db=postgres
            - --db-url=jdbc:postgresql://{{ include "mintkey.fullname" . }}-postgres:5432/mintkey
            - --db-username=mintkey_migrate
            - --db-password=$(POSTGRES_MIGRATE_PASSWORD)
          env:
            - name: POSTGRES_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_MIGRATE_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://{{ include "mintkey.fullname" . }}-postgres:5432/mintkey
            - name: KC_DB_USERNAME
              value: mintkey_migrate
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_MIGRATE_PASSWORD
            - name: KC_HTTP_PORT
              value: "8443"
            {{- if .Values.ingress.keycloak.host }}
            # Behind the cloudflared tunnel (TLS terminated at the edge): pin the
            # frontend URL so every issued token carries a stable public https
            # `iss` — the admin-api validates iss === <public keycloak>/realms/mintkey
            # (apps/admin-api/src/admin_api/auth/oidc.py). Without this, start-dev
            # derives iss from the request → http:// → OIDC login fails id_token_invalid.
            - name: KC_HOSTNAME_URL
              value: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.keycloak.tls) .Values.ingress.keycloak.host | quote }}
            - name: KC_HOSTNAME_ADMIN_URL
              value: {{ printf "%s://%s" (ternary "https" "http" .Values.ingress.keycloak.tls) .Values.ingress.keycloak.host | quote }}
            - name: KC_HOSTNAME_STRICT
              value: "false"                # allow in-cluster access via the Service name
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"                 # TLS is at cloudflared, Keycloak serves http
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            {{- end }}
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: JAVA_OPTS_APPEND
              value: "-Xms256m -Xmx768m"
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mintkey.fullname" . }}-keycloak
  labels:
    {{- include "mintkey.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  selector:
    {{- include "mintkey.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      port: 8443
      targetPort: 8443
