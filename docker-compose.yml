# Mintkey full-stack compose — 15 long-running services + 2 one-shot jobs = 17 services
# Startup graph and volume requirements from design §11; KEK separate mount per ADR-0003.
# Port mapping from design §11 networking table.

name: mintkey

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:        # /var/lib/postgresql/data
  vault_data:           # /var/lib/mintkey/ (vault.sqlite) — encrypted credential store
  vault_kek:            # /run/secrets/ (mintkey_kek_keyfile) — SEPARATE from vault_data (ADR-0003 defense in depth)
  bootstrap_secrets:    # /run/secrets/mintkey/bootstrap-secrets/
  grafana_data:         # /var/lib/grafana

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  mintkey:
    driver: bridge

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ─── 1. Postgres ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mintkey
      POSTGRES_USER: mintkey_migrate
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mintkey
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintkey_migrate -d mintkey"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── 2. Keycloak (parallel; uses postgres for its own schema) ─────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --db postgres --db-url jdbc:postgresql://postgres:5432/mintkey --db-username mintkey_migrate --db-password changeme
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mintkey
      KC_DB_USERNAME: mintkey_migrate
      KC_DB_PASSWORD: changeme
      KC_HTTP_PORT: "8443"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
    ports:
      - "8443:8443"
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── 16. Liquibase (one-shot job) ─────────────────────────────────────────
  liquibase:
    image: liquibase/liquibase:4.27.0
    command:
      - --url=jdbc:postgresql://postgres:5432/mintkey
      - --username=mintkey_migrate
      - --password=changeme
      - --changeLogFile=changelog/db.changelog-master.yaml
      - update
    volumes:
      - ./admin-api/db/changelog:/liquibase/changelog:ro
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 17. Seed-job (one-shot job) ──────────────────────────────────────────
  seed-job:
    build:
      context: ./seed-job
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: mintkey
      PGUSER: mintkey_migrate
      PGPASSWORD: changeme
      BOOTSTRAP_SECRETS_DIR: /run/secrets/mintkey/bootstrap-secrets
    volumes:
      - bootstrap_secrets:/run/secrets/mintkey/bootstrap-secrets
    networks:
      - mintkey
    depends_on:
      liquibase:
        condition: service_completed_successfully

  # ─── 3. Vault Adapter ─────────────────────────────────────────────────────
  vault-adapter:
    build:
      context: .
      dockerfile: services/vault-adapter/Dockerfile
    environment:
      MINTKEY_ENV: dev
      MINTKEY_VAULT_KEK: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
      VAULT_GRPC_PORT: "8084"
      MINTKEY_VAULT_FILE_PATH: /var/lib/mintkey/vault.sqlite
    volumes:
      - vault_data:/var/lib/mintkey
      - vault_kek:/run/secrets
    ports:
      - "8084:8084"
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=:8084"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── 4. Admin API ─────────────────────────────────────────────────────────
  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://mintkey_app:@postgres:5432/mintkey
      VAULT_GRPC_ADDR: vault-adapter:8084
      MINTKEY_ENV: dev
    ports:
      - "8080:8080"
    networks:
      - mintkey
    depends_on:
      seed-job:
        condition: service_completed_successfully
      vault-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/v1/health') or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── 5. Admin UI (AdminJS) — placeholder until admin-ui/ Dockerfile exists ─
  admin-ui:
    image: nginx:alpine
    volumes:
      - ./admin-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:8081"
    networks:
      - mintkey
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── 6. MCP Server — placeholder until mcp-server/ Dockerfile exists ──────
  mcp-server:
    image: nginx:alpine
    volumes:
      - ./mcp-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:8082"
    networks:
      - mintkey
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── 7. Broker ────────────────────────────────────────────────────────────
  broker:
    build:
      context: .
      dockerfile: services/broker/Dockerfile
    environment:
      MINTKEY_ENV: dev
      BROKER_PORT: "8083"
      VAULT_GRPC_ADDR: vault-adapter:8084
    ports:
      - "8083:8083"
    networks:
      - mintkey
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://localhost:8083/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── 8. Kong (DB-less) ────────────────────────────────────────────────────
  kong:
    image: kong:3.6
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes:
      - ./services/proxy-plugin/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ─── 9. Kong Syncer ───────────────────────────────────────────────────────
  kong-syncer:
    build:
      context: .
      dockerfile: services/kong-syncer/Dockerfile
    environment:
      MINTKEY_ENV: dev
      KONG_ADMIN_URL: http://kong:8001
      DATABASE_URL: postgres://mintkey_app:@postgres:5432/mintkey
      KONG_SYNCER_HTTP_PORT: "8085"
    ports:
      - "8085:8085"
    networks:
      - mintkey
    depends_on:
      kong:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://127.0.0.1:8085/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── 10. Proxy Plugin ─────────────────────────────────────────────────────
  proxy-plugin:
    build:
      context: .
      dockerfile: services/proxy-plugin/Dockerfile
    environment:
      MINTKEY_ENV: dev
      BROKER_ADDR: broker:8083
      VAULT_GRPC_ADDR: vault-adapter:8084
      PLUGIN_PORT: "8086"
    ports:
      - "8086:8086"
    networks:
      - mintkey
    depends_on:
      kong:
        condition: service_healthy
    # proxy-plugin is a Kong go-pdk plugin — no HTTP health endpoint.
    # It uses a Unix socket for Kong communication; healthcheck not applicable.

  # ─── 11. Mock Backend (no deps; always up) ────────────────────────────────
  mock-backend:
    image: nginx:alpine
    volumes:
      - ./mock-backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8999:8999"
    networks:
      - mintkey
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8999/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ─── 12. OTel Collector ───────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
    networks:
      - mintkey
    # otel-collector-contrib is distroless — no shell/wget for CMD-SHELL.
    # Healthcheck disabled; services tolerate transient OTel unavailability.

  # ─── 13. Jaeger ───────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - mintkey
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── 14. Prometheus ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - mintkey
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── 15. Grafana ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: changeme
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - mintkey
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
