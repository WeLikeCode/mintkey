# Mintkey full-stack compose — 15 long-running services + 2 one-shot jobs = 17 services
# Startup graph and volume requirements from design §11; KEK separate mount per ADR-0003.
# Port mapping from design §11 networking table.

name: mintkey

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:        # /var/lib/postgresql/data
  vault_data:           # /var/lib/mintkey/ (vault.sqlite) — encrypted credential store
  vault_kek:            # /run/secrets/ (mintkey_kek_keyfile) — SEPARATE from vault_data (ADR-0003 defense in depth)
  bootstrap_secrets:    # /run/secrets/mintkey/bootstrap-secrets/
  grafana_data:         # /var/lib/grafana
  broker_wal:           # /var/lib/mintkey/ — broker WAL + dead-letter (#22)
  proxy_wal:            # /var/lib/mintkey/ — proxy-plugin WAL + dead-letter (#22)

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  mintkey:
    driver: bridge

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ─── 1. Postgres ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 512m
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_DB: mintkey
      POSTGRES_USER: mintkey_migrate
      POSTGRES_PASSWORD: changeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mintkey
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintkey_migrate -d mintkey"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── 2. Keycloak (parallel; uses postgres for its own schema) ─────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    mem_limit: 1g
    command: start-dev --db postgres --db-url jdbc:postgresql://postgres:5432/mintkey --db-username mintkey_migrate --db-password changeme
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mintkey
      KC_DB_USERNAME: mintkey_migrate
      KC_DB_PASSWORD: changeme
      KC_HTTP_PORT: "8443"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
      JAVA_OPTS_APPEND: "-Xms256m -Xmx768m"
    ports:
      - "8443:8443"
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8443 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── 16. Liquibase (one-shot job) ─────────────────────────────────────────
  liquibase:
    image: liquibase/liquibase:4.27.0
    restart: on-failure:3
    mem_limit: 256m
    command:
      - --url=jdbc:postgresql://postgres:5432/mintkey
      - --username=mintkey_migrate
      - --password=changeme
      - --changeLogFile=changelog/db.changelog-master.yaml
      - update
    volumes:
      - ./admin-api/db/changelog:/liquibase/changelog:ro
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 17. Seed-job (one-shot job) ──────────────────────────────────────────
  seed-job:
    build:
      context: ./seed-job
    restart: on-failure:3
    mem_limit: 128m
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: mintkey
      PGUSER: mintkey_migrate
      PGPASSWORD: changeme
      BOOTSTRAP_SECRETS_DIR: /run/secrets/mintkey/bootstrap-secrets
    volumes:
      - bootstrap_secrets:/run/secrets/mintkey/bootstrap-secrets
    networks:
      - mintkey
    depends_on:
      liquibase:
        condition: service_completed_successfully

  # ─── 3. Vault Adapter ─────────────────────────────────────────────────────
  vault-adapter:
    build:
      context: .
      dockerfile: services/vault-adapter/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      MINTKEY_VAULT_KEK: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
      VAULT_GRPC_PORT: "8084"
      VAULT_HTTP_PORT: "8087"
      MINTKEY_VAULT_FILE_PATH: /var/lib/mintkey/vault.sqlite
    volumes:
      - vault_data:/var/lib/mintkey
      - vault_kek:/run/secrets
    ports:
      - "8084:8084"
      - "8087:8087"
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/grpc_health_probe", "-addr=:8084"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── 4. Admin API ─────────────────────────────────────────────────────────
  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DATABASE_URL: postgresql+asyncpg://mintkey_app:mintkey_app_password@postgres:5432/mintkey
      VAULT_GRPC_ADDR: vault-adapter:8084
      MINTKEY_ENV: dev
      ADMIN_UI_PUBLIC_KEY_PATH: /run/secrets/mintkey/bootstrap-secrets/admin_ui_public.pem
      # Service tokens: allowlist for /v1/internal/audit/emit (#22).
      # Real deployments must override these with secrets from a vault / CI secret store.
      MINTKEY_BROKER_SERVICE_TOKEN: "mk_svctoken_dev_broker_1a9915207f79a78a"
      MINTKEY_PROXY_SERVICE_TOKEN: "mk_svctoken_dev_proxy_6eff05779828be47"
      MINTKEY_MCP_SERVICE_TOKEN: dev-mcp-service-token
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      # OPS-FF Fix 2: explicit MCP_BASE_URL so agent mcp_endpoint URLs use correct port.
      # Override via .env if mcp-server is exposed on a different host/port.
      MCP_BASE_URL: "http://localhost:8082"
    volumes:
      - bootstrap_secrets:/run/secrets/mintkey/bootstrap-secrets:ro
    ports:
      - "8080:8080"
    networks:
      - mintkey
    depends_on:
      seed-job:
        condition: service_completed_successfully
      vault-adapter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8080/v1/health') or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── 5. Admin UI (AdminJS) ─────────────────────────────────────────────────
  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ADMIN_API_URL: http://admin-api:8080
      SESSION_SECRET: mintkey-session-secret-change-in-production
      PORT: "8081"
      # Admin credentials for server-to-server API calls (ADR-0019 signed-request JWT)
      ADMIN_EMAIL: admin@mintkey.internal
      ADMIN_PASSWORD_FILE: /run/secrets/mintkey/bootstrap-secrets/admin_password
      ADMIN_UI_PRIVATE_KEY_PATH: /run/secrets/mintkey/bootstrap-secrets/admin_ui_private.pem
      # (OPS-X) Proxy base URL shown on service show page as proxy_url field
      MINTKEY_PROXY_URL: "http://localhost:8000"
    volumes:
      - bootstrap_secrets:/run/secrets/mintkey/bootstrap-secrets:ro
    ports:
      - "8081:8081"
    networks:
      - mintkey
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ─── 6. MCP Server ────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DATABASE_URL: postgresql+asyncpg://mintkey_app:mintkey_app_password@postgres:5432/mintkey
      ADMIN_API_BASE_URL: http://admin-api:8080
      MINTKEY_ENV: dev
      BROKER_BASE_URL: http://broker:8083
      MINTKEY_MCP_SERVICE_TOKEN: dev-mcp-service-token
      OTEL_EXPORTER_OTLP_ENDPOINT: "otel-collector:4317"
      # OPS-FF Fix 3: override internal Docker DNS default so bootstrap returns
      # a host-reachable proxy URL. mintkey-proxy:8000 remains correct for in-cluster.
      MINTKEY_PROXY_URL: "http://localhost:8000"
    ports:
      - "8082:8082"
    networks:
      - mintkey
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8082/health') or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ─── 7. Broker ────────────────────────────────────────────────────────────
  broker:
    build:
      context: .
      dockerfile: services/broker/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      BROKER_PORT: "8083"
      VAULT_GRPC_ADDR: vault-adapter:8084
      DATABASE_URL: postgres://mintkey_app:mintkey_app_password@postgres:5432/mintkey
      MINTKEY_MCP_SERVICE_TOKEN: dev-mcp-service-token
      MINTKEY_PROXY_SERVICE_TOKEN: "mk_svctoken_dev_proxy_6eff05779828be47"
      # Audit async emission (#22): broker identity token + admin-api URL.
      MINTKEY_BROKER_SERVICE_TOKEN: "mk_svctoken_dev_broker_1a9915207f79a78a"
      MINTKEY_ADMIN_API_URL: "http://admin-api:8080"
    volumes:
      - broker_wal:/var/lib/mintkey
    ports:
      - "8083:8083"
    networks:
      - mintkey
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://localhost:8083/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── 8. Kong (DB-less) ────────────────────────────────────────────────────
  kong:
    image: kong:3.6
    restart: unless-stopped
    mem_limit: 512m
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_NGINX_WORKER_PROCESSES: "2"
    volumes:
      - ./services/proxy-plugin/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - mintkey
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kong health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ─── 9. Kong Syncer ───────────────────────────────────────────────────────
  kong-syncer:
    build:
      context: .
      dockerfile: services/kong-syncer/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      KONG_ADMIN_URL: http://kong:8001
      DATABASE_URL: postgres://mintkey_app:mintkey_app_password@postgres:5432/mintkey?sslmode=disable
      KONG_SYNCER_HTTP_PORT: "8085"
    ports:
      - "8085:8085"
    networks:
      - mintkey
    depends_on:
      kong:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://127.0.0.1:8085/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ─── 10. Proxy Plugin ─────────────────────────────────────────────────────
  proxy-plugin:
    build:
      context: .
      dockerfile: services/proxy-plugin/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MINTKEY_ENV: dev
      BROKER_ADDR: broker:8083
      VAULT_GRPC_ADDR: vault-adapter:8084
      PLUGIN_PORT: "8086"
      DEFAULT_TARGET: http://mock-backend:8999
      # MINTKEY_PROXY_SERVICE_TOKEN serves dual purpose:
      #   (a) X-Mintkey-Service-Token sent to broker /v1/api-keys/resolve (ADR-0018)
      #   (b) X-Mintkey-Service-Token sent to admin-api /v1/internal/audit/emit (#22)
      # Must match the value in admin-api's MINTKEY_PROXY_SERVICE_TOKEN allowlist.
      MINTKEY_PROXY_SERVICE_TOKEN: "mk_svctoken_dev_proxy_6eff05779828be47"
      DATABASE_URL: postgres://mintkey_app:mintkey_app_password@postgres:5432/mintkey
      # ADR-0004 addendum: permissive in dev (default); operators set strict in production.
      # Override with MINTKEY_AUD_ENFORCEMENT=strict to test strict mode locally.
      MINTKEY_AUD_ENFORCEMENT: permissive
      # Audit async emission (#22): admin-api URL for WAL drain.
      MINTKEY_ADMIN_API_URL: "http://admin-api:8080"
    volumes:
      - proxy_wal:/var/lib/mintkey
    ports:
      - "8086:8086"
    networks:
      - mintkey
    depends_on:
      kong:
        condition: service_healthy
    # proxy-plugin now runs as an HTTP reverse proxy on PLUGIN_PORT.
    healthcheck:
      test: ["CMD", "/wget", "-qO-", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── 11. Mock Backend ─────────────────────────────────────────────────────
  mock-backend:
    build:
      context: ./mock-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8999:8999"
    networks:
      - mintkey
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8999/health') or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── 12. OTel Collector ───────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    restart: unless-stopped
    mem_limit: 256m
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
    networks:
      - mintkey
    # otel-collector-contrib is distroless — no shell/wget for CMD-SHELL.
    # Healthcheck disabled; services tolerate transient OTel unavailability.

  # ─── 13. Jaeger ───────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    restart: unless-stopped
    mem_limit: 128m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - mintkey
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:14269/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── 14. Prometheus ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    networks:
      - mintkey
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ─── 16b. cAdvisor — container memory metrics ────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8088:8080"
    networks:
      - mintkey
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── 15. Grafana ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    restart: unless-stopped
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3003:3000"
    networks:
      - mintkey
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
