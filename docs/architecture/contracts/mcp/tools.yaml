###############################################################################
# Mintkey MCP Server tool catalog (iteration-4 wire contract)
#
# Stability tier: experimental.
# Bumps `server.version` on breaking changes.
#
# ---------------------------------------------------------------------------
# Multi-tenancy (per ADR-0008 / ADR-0009)
# ---------------------------------------------------------------------------
#   The agent's tenant is resolved from its authentication context (the
#   Agent API Key), NOT from a tool input parameter. No MCP tool exposes a
#   `tenant_id` argument. Cross-tenant calls are impossible by construction.
#
# ---------------------------------------------------------------------------
# Auth (per ADR-0009)
# ---------------------------------------------------------------------------
#   Transport       Authentication
#   --------------  ------------------------------------------------------
#   HTTP / SSE      `Authorization: Bearer <Agent API Key>` HTTP header.
#   stdio           `MINTKEY_AGENT_API_KEY` environment variable.
#
#   The Agent API Key is the long-lived credential issued by Mintkey at
#   agent creation time (`mk_live_…`). It is hashed at rest (Argon2id).
#
# ---------------------------------------------------------------------------
# ID prefixes (same conventions as the REST contract)
# ---------------------------------------------------------------------------
#   tenant_…    Tenant
#   operator_…  Operator
#   agent_…     Agent
#   svc_…       Service
#   cred_…      Credential
#   perm_…      PermissionGrant
#   audit_…     AuditEvent
#   change_…    ChangeEvent
#   sec_…       AgentSecret         (ADR-0025)
#   secgrant_…  AgentSecretGrant    (ADR-0025)
#
# ---------------------------------------------------------------------------
# Time
# ---------------------------------------------------------------------------
#   All timestamps are RFC 3339 UTC.
#
# ---------------------------------------------------------------------------
# Sensitive fields
# ---------------------------------------------------------------------------
#   The brokered JWT returned by `request_token` is sensitive — the agent
#   should hold it in process memory and not log it. The output schema
#   marks it with `x-mintkey-sensitive: true`.
###############################################################################

mcp_version: "2024-11-05"
server:
  name: "mintkey"
  version: "0.1.0-preview.1"
  description: |
    Discovery and credential-broker tool surface exposed by the Mintkey
    MCP Server (control-plane container C4 in
    `docs/01-architecture/02-container-view.md`). Implemented in Python
    against the Anthropic `mcp` SDK (ADR-0009).
  vendor: "mintkey"
  stability: "experimental"

# ---------------------------------------------------------------------------
# Common subschemas referenced from the per-tool schemas below.
# ---------------------------------------------------------------------------
$defs:

  ulid_id:
    type: string
    pattern: "^[a-z]+_[0-9A-HJKMNP-TV-Z]{26}$"
    description: ULID prefixed by resource type.

  service_id:
    type: string
    pattern: "^svc_[0-9A-HJKMNP-TV-Z]{26}$"

  agent_id:
    type: string
    pattern: "^agent_[0-9A-HJKMNP-TV-Z]{26}$"

  secret_id:
    type: string
    pattern: "^sec_[0-9A-HJKMNP-TV-Z]{26}$"
    description: AgentSecret ULID (sec_ prefix, per ADR-0025).

  timestamp:
    type: string
    format: date-time
    description: RFC 3339 UTC.

  auth_scheme:
    type: string
    description: "Auth scheme of the registered backend service. Per ADR-0016.5, ADR-0021, ADR-0024."
    enum:
      - api_key_header
      - api_key_query
      - bearer_token
      - basic_auth
      - oauth2_client_credentials
      - oidc_client_secret
      - mtls
      - apple_jwt
      - google_service_account
      - ssh_private_key
      - ssh_ca
      - ssh_password
      - email_password
      - email_oauth2
      - email_app_password
      - http_digest

  service_summary:
    type: object
    description: |
      Compact service descriptor returned by `list_services`. Fields are
      identical to the REST `Service` schema except that `tenant_id` is
      omitted (the agent's tenant is implicit from auth context).
    additionalProperties: false
    properties:
      service_id:
        $ref: "#/$defs/service_id"
      name:
        type: string
      display_name:
        type: string
      description:
        type: string
      base_url:
        type: string
        format: uri
      auth_scheme:
        $ref: "#/$defs/auth_scheme"
      actions:
        type: array
        items:
          type: string
        description: |
          Granted-to-the-calling-agent subset of the service's actions.
          Actions the agent has no permission for are filtered out.
      openapi_url:
        type: string
        format: uri
        nullable: true
    required:
      - service_id
      - name
      - display_name
      - base_url
      - auth_scheme
      - actions

  injection_hint:
    type: object
    description: |
      Per-auth-scheme injection hint: what the proxy injects, where, and what
      the agent must NOT send. Derived from the single-source-of-truth table in
      `apps/mcp-server/src/mcp_server/auth_schemes.py`, which mirrors
      `proxy-plugin/internal/credential/injector.go`.
    additionalProperties: false
    properties:
      injects:
        type: string
        description: |
          Human-readable description of what the proxy sets on the outbound
          request (e.g. "Proxy sets Authorization: Bearer <secret>").
      location:
        type: string
        enum: [header, query, connection, out_of_band]
        description: |
          Where the injected value appears: "header" for HTTP request headers,
          "query" for URL query parameters, "connection" for transport-level
          auth (SSH, mTLS), "out_of_band" for schemes handled by a dedicated
          proxy surface (email, SSH) that is not the HTTP proxy.
      never_send:
        type: string
        description: |
          What the agent MUST NOT send to the upstream service — the proxy
          either strips it or it conflicts with the injected value.
      handled_by:
        type: string
        description: |
          Mintkey component that handles this scheme: "http-proxy" (Kong egress
          plugin), "ssh-proxy" (SSH bastion), or "email-proxy".
      status:
        type: string
        enum: [injected_by_proxy, not_implemented, handled_by_other_proxy]
        description: |
          "injected_by_proxy"      — Kong plugin handles injection; call works.
          "not_implemented"        — proxy returns an error (e.g. mtls).
          "handled_by_other_proxy" — use the named proxy surface, not Kong.
    required: [injects, location, never_send, handled_by, status]

  how_to_call:
    type: object
    description: |
      Usage hint for a service entry in `discover`. Contains the step-by-step
      call recipe plus a per-scheme injection hint.
    additionalProperties: false
    properties:
      action:
        type: string
        description: Default action string to request a token with.
      step1_request_token:
        type: string
        description: Human-readable step 1 — how to call request_token.
      step2_proxy_call:
        type: string
        description: Human-readable step 2 — how to call the proxy.
      proxy_url_pattern:
        type: string
        description: |
          Full proxy URL pattern including service_id and placeholder path.
      notes:
        type: string
        description: Additional guidance for this service.
      injection_hint:
        $ref: "#/$defs/injection_hint"
        description: |
          Per-scheme hint: what the proxy injects and what the agent must not
          send. Present for HTTP-proxy schemes; absent for SSH/email services
          which use a separate how_to_call shape.

  service_full:
    type: object
    description: |
      Full service descriptor returned by `describe_service`. Identical to
      `service_summary` plus optional `current_key_version`, proxy URLs,
      auth scheme details, calling-agent constraints, and OpenAPI availability.
    additionalProperties: false
    properties:
      service_id:
        $ref: "#/$defs/service_id"
      name:
        type: string
      display_name:
        type: string
      description:
        type: string
      base_url:
        type: string
        format: uri
      auth_scheme:
        $ref: "#/$defs/auth_scheme"
      actions:
        type: array
        items:
          type: string
      openapi_url:
        type: string
        format: uri
        nullable: true
      current_key_version:
        type: integer
        minimum: 0
      explicit_proxy_url:
        type: string
        format: uri
        description: |
          Path-based proxy URL — `<proxy>/v1/call/<service_id>/<path>`.
          The agent appends `<path>` after this prefix.
      virtual_host_proxy_url:
        type: string
        format: uri
        description: |
          Virtual-host proxy URL — `https://<service-slug>.<tenant-slug>.proxy.local`.
      auth_scheme_details:
        type: object
        description: |
          Injection-point details for the service's auth scheme. Derived from
          the injection-hint table (auth_schemes.py) plus per-credential
          overrides (header_name, query_param).
        additionalProperties: false
        properties:
          injection_point:
            type: string
            description: |
              Where the credential is injected: "header", "query",
              "connection", or "out_of_band".
          header_name:
            type: [string, "null"]
            description: |
              HTTP header name used for injection (e.g. "X-API-Key",
              "Authorization"). Null for non-header schemes.
          query_param:
            type: [string, "null"]
            description: |
              URL query parameter name used for injection (e.g. "api_key").
              Null for non-query schemes.
          format:
            type: string
            description: |
              Value format description, e.g. "Bearer <token>",
              "base64(user:pass)", "<raw_key>".
        required: [injection_point, header_name, query_param, format]
      your_constraints:
        type: object
        description: |
          The calling agent's permission-grant constraints for this service.
          Each field is null when the operator has not set a limit.
        additionalProperties: false
        properties:
          rate_limit:
            type: [integer, "null"]
            description: Maximum requests allowed within `time_window` seconds.
          time_window:
            type: [integer, "null"]
            description: Time window in seconds for `rate_limit`.
          request_path_prefix:
            type: [string, "null"]
            description: |
              If set, only paths under this prefix are permitted through the
              proxy for this agent on this service.
          source_ip_allowlist:
            type: ["array", "null"]
            items:
              type: string
            description: |
              If set, the proxy rejects requests whose source IP is not in
              this CIDR allowlist.
          budget:
            type: [object, "null"]
            description: |
              The agent's budget status for this permission grant. Null when
              no budget is configured on the grant. Populated from the
              `budget_counters` table joined with the grant's constraints.
            additionalProperties: false
            properties:
              ceiling:
                type: integer
                minimum: 1
                description: Maximum calls allowed in the current period.
              period:
                type: string
                enum: [hourly, daily, weekly, monthly]
                description: Budget reset cadence.
              used:
                type: integer
                minimum: 0
                description: Calls consumed in the current period.
              remaining:
                type: integer
                minimum: 0
                description: Calls remaining before the ceiling is hit.
              period_end:
                type: string
                format: date-time
                description: RFC 3339 UTC timestamp when the current period ends and the budget resets.
              alert_thresholds:
                type: array
                items:
                  type: integer
                  minimum: 1
                  maximum: 100
                description: Percentage levels that trigger audit events (e.g. [50, 80, 100]).
            required: [ceiling, period, used, remaining, period_end, alert_thresholds]
        required: [rate_limit, time_window, request_path_prefix, source_ip_allowlist, budget]
      openapi:
        type: object
        description: |
          OpenAPI availability for this service. Tells the agent whether
          calling `get_openapi` is worth it before actually fetching.
        additionalProperties: false
        properties:
          status:
            type: string
            enum: [available, not_registered, fetch_failed]
            description: |
              "available"      — operator has registered an openapi_url; fetch
                                 it via get_openapi.
              "not_registered" — no openapi_url set; ask the operator to add one.
              "fetch_failed"   — URL is registered but the last fetch attempt
                                 failed (timeout, oversized, or unreachable).
          url:
            type: [string, "null"]
            format: uri
            description: The registered openapi_url, or null if not_registered.
        required: [status, url]
    required:
      - service_id
      - name
      - display_name
      - base_url
      - auth_scheme
      - actions
      - explicit_proxy_url
      - virtual_host_proxy_url

  error_code:
    type: string
    description: |
      Machine-readable error codes emitted by any MCP tool. Closed enum.
      Mapping to REST `mintkey:code` documented in ADR-0017.10.
    enum:
      - not_authorized
      - service_not_found
      - action_not_granted
      - invalid_argument
      - rate_limited
      - tenant_suspended
      - tenant_deleted
      - agent_revoked
      - token_expired
      - token_revoked
      - validation_failed
      - unavailable
      - secret_not_found

# ---------------------------------------------------------------------------
# Errors emitted by ANY tool (in addition to per-tool error lists).
# ---------------------------------------------------------------------------
common_errors:
  - code: "not_authorized"
    message: |
      Agent is not authenticated, or the Agent API Key has been revoked.
  - code: "tenant_suspended"
    message: |
      The agent's tenant has been suspended by the platform admin.
  - code: "rate_limited"
    message: |
      Per-tenant or per-agent rate limit exceeded.
  - code: "unavailable"
    message: |
      A required dependency (DB, Vault Adapter, change channel) is
      currently unavailable. Retry with backoff.

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
tools:

  # =========================================================================
  - name: "list_services"
    description: |
      List the services this agent has any permissions on. Filtered by
      tenant (resolved from the agent's API key) and by the agent's
      permission grants. Pagination by ULID cursor matches the REST API.
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        name_contains:
          type: string
          description: |
            Optional case-insensitive substring filter on the service name.
          maxLength: 200
        after:
          type: string
          description: |
            Optional pagination cursor — the `service_id` from the previous
            page. Exclusive.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        services:
          type: array
          items:
            $ref: "#/$defs/service_summary"
        next_cursor:
          type: string
          nullable: true
        hint:
          type: string
          description: "Next-step guidance (e.g. call describe_service for auth details)."
        capabilities:
          type: string
          description: >-
            One-line summary of the server's built-in tools (agent secret
            storage, describe_service, get_openapi, email tools) so agents
            that only refresh the service catalog still discover them.
      required: [services, next_cursor]
    errors:
      - code: "invalid_argument"
        message: "`limit` out of range or `after` is malformed."
    examples:
      - name: "list-with-filter"
        request:
          name_contains: "crm"
          limit: 50
        response:
          services:
            - service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
              name: "crm"
              display_name: "Acme CRM"
              description: "Internal CRM API."
              base_url: "https://crm.acme.example/api"
              auth_scheme: "bearer_token"
              actions: ["read:contacts", "write:contacts"]
              openapi_url: "https://crm.acme.example/openapi.json"
          next_cursor: null

  # =========================================================================
  - name: "describe_service"
    description: |
      Return full metadata for a single service the agent can see. Returns
      `service_not_found` if the agent has no permissions on the service
      (tenant-scoped lookup; cross-tenant `service_id`s also fall through
      to `service_not_found`).
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: "#/$defs/service_id"
      required: [service_id]
    output_schema:
      $ref: "#/$defs/service_full"
    errors:
      - code: "service_not_found"
        message: |
          Service does not exist in this tenant, or the agent has no
          permissions on it.
      - code: "invalid_argument"
        message: "`service_id` is malformed."
    examples:
      - name: "describe-crm"
        request:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
        response:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
          name: "crm"
          display_name: "Acme CRM"
          description: "Internal CRM API."
          base_url: "https://crm.acme.example/api"
          auth_scheme: "bearer_token"
          actions: ["read:contacts", "write:contacts"]
          openapi_url: "https://crm.acme.example/openapi.json"
          current_key_version: 3
          explicit_proxy_url: "https://proxy.local/v1/call/svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
          virtual_host_proxy_url: "https://crm.acme.proxy.local"
          auth_scheme_details:
            injection_point: "header"
            header_name: "Authorization"
            query_param: null
            format: "Bearer <token>"
          your_constraints:
            rate_limit: 100
            time_window: 60
            request_path_prefix: null
            source_ip_allowlist: null
            budget:
              ceiling: 1000
              period: "daily"
              used: 847
              remaining: 153
              period_end: "2026-06-28T00:00:00Z"
              alert_thresholds: [50, 80, 100]
          openapi:
            status: "available"
            url: "https://crm.acme.example/openapi.json"

  # =========================================================================
  - name: "get_openapi"
    description: |
      Return the service's OpenAPI document — either as a URL (default) or
      inline (when ≤ 1 MB and the operator has opted in to inline serving).
      The result is discriminated by `kind`.

      When no openapi_url is registered: `kind: not_registered`.
      When the registered URL is unreachable or oversized: `kind: fetch_failed`
      (the url is still included so the agent can report it to the operator).
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: "#/$defs/service_id"
        inline:
          type: boolean
          default: false
          description: |
            When true, attempt to fetch the document and return it inline.
            When false (default), return the URL only.
      required: [service_id]
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      oneOf:
        - type: object
          additionalProperties: false
          description: Registered openapi_url returned as-is (default mode).
          properties:
            kind:
              type: string
              enum: [url]
            openapi_url:
              type: string
              format: uri
            etag:
              type: [string, "null"]
          required: [kind, openapi_url]
        - type: object
          additionalProperties: false
          description: |
            Inline mode: document fetched server-side (≤ 1 MiB, etag-conditional).
          properties:
            kind:
              type: string
              enum: [inline]
            content_type:
              type: string
              enum: ["application/json", "application/yaml"]
            etag:
              type: [string, "null"]
            document:
              description: Verbatim OpenAPI document bytes (string-encoded).
              type: string
              maxLength: 1048576
          required: [kind, content_type, document]
        - type: object
          additionalProperties: false
          description: No openapi_url has been registered for this service.
          properties:
            kind:
              type: string
              enum: [not_registered]
            hint:
              type: string
              description: |
                Operator-facing hint: how to set openapi_url at service
                registration.
          required: [kind]
        - type: object
          additionalProperties: false
          description: |
            Fetch was attempted but failed (timeout, oversized, or unreachable).
            The url is included so the agent can report it to the operator.
          properties:
            kind:
              type: string
              enum: [fetch_failed]
            openapi_url:
              type: string
              format: uri
              description: The registered URL that could not be fetched.
            reason:
              type: string
              description: Short human-readable failure reason.
          required: [kind, openapi_url]
      discriminator:
        propertyName: kind
    errors:
      - code: "service_not_found"
        message: |
          Service does not exist in this tenant, or the agent has no
          permissions on it.
      - code: "invalid_argument"
        message: |
          `service_id` is malformed.
    examples:
      - name: "openapi-by-url"
        request:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
        response:
          kind: "url"
          openapi_url: "https://crm.acme.example/openapi.json"
          etag: "W/\"6c1b-T3kX\""
      - name: "openapi-inline-yaml"
        request:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S2"
          inline: true
        response:
          kind: "inline"
          content_type: "application/yaml"
          etag: null
          document: "openapi: 3.1.0\ninfo: ...\n"
      - name: "openapi-not-registered"
        request:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S3"
        response:
          kind: "not_registered"
          hint: >
            The operator has not set an openapi_url for this service.
            Set it at service registration in the admin UI or via the
            PATCH /v1/tenants/{tenant_id}/services/{service_id} endpoint.
      - name: "openapi-fetch-failed"
        request:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S4"
          inline: true
        response:
          kind: "fetch_failed"
          openapi_url: "https://unreachable.example/openapi.json"
          reason: "connection timeout after 10s"

  # =========================================================================
  - name: "request_token"
    description: |
      Mint a brokered JWT for `(service_id, action)`. Per ADR-0006 the JWT
      is JWS Ed25519, single-scope, audience-bound to the service. Per
      ADR-0008 the broker stamps the agent's tenant into a `tnt` claim and
      the proxy enforces tenant match on every request.

      The optional `ttl_seconds` is clamped to the per-service min/max
      (default 60..3600). The default TTL is 600 (10 minutes) when not
      supplied.

      The returned `proxy_endpoint` is the path-based form. Use
      `proxy_endpoint(service_id)` for both URL forms when the agent
      prefers the virtual-host alias.
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: "#/$defs/service_id"
        action:
          type: string
          description: |
            A single action/scope string. Multiple scopes per token are
            unsupported in v1; agents request one token per action.
          minLength: 1
          maxLength: 200
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: |
            Optional override of the service's default TTL.
      required: [service_id, action]
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          x-mintkey-sensitive: true
          description: |
            The brokered JWT. JWS Ed25519. Sensitive — do not log.
        token_type:
          type: string
          enum: [Bearer]
        expires_at:
          $ref: "#/$defs/timestamp"
        jti:
          type: string
          description: ULID-encoded JWT id; matches `jti` in the JWT payload.
        key_version:
          type: integer
          minimum: 1
          description: |
            Credential `key_version` the proxy will inject for this token.
        proxy_endpoint:
          type: string
          format: uri
          description: |
            Path-based proxy URL the agent should call.
      required:
        - token
        - token_type
        - expires_at
        - jti
        - key_version
        - proxy_endpoint
    errors:
      - code: "service_not_found"
        message: "Service does not exist in this tenant."
      - code: "action_not_granted"
        message: |
          The agent does not have a permission grant for
          `(service_id, action)`.
      - code: "not_authorized"
        message: "Agent is revoked or the API key is invalid."
      - code: "rate_limited"
        message: |
          Token-issuance rate limit exceeded for this agent or tenant.
      - code: "invalid_argument"
        message: "`ttl_seconds` out of range or `action` malformed."
      - code: "unavailable"
        message: |
          The Vault Adapter is unreachable; cannot resolve a credential
          version.
    examples:
      - name: "happy-path"
        request:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
          action: "read:contacts"
          ttl_seconds: 600
        response:
          token: "eyJhbGciOiJFZERTQSIsImtpZCI6ImJyb2tlci0yMDI2LTA1LTEwIn0..."
          token_type: "Bearer"
          expires_at: "2026-05-10T14:10:00Z"
          jti: "01HX5J9F8V8H8V0CG3F2Y5J6Q1"
          key_version: 3
          proxy_endpoint: "https://proxy.local/v1/call/svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"

  # =========================================================================
  - name: "proxy_endpoint"
    description: |
      Return both URL forms the agent may call to reach the proxy for this
      service (per ADR-0007). Both forms route to the same Kong route +
      plugin chain; the choice is purely a developer-experience preference.
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: "#/$defs/service_id"
      required: [service_id]
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        explicit_url:
          type: string
          format: uri
          description: |
            Path-based form — `https://proxy.local/v1/call/<service_id>`.
            The agent appends the in-service path after this prefix.
        virtual_host_url:
          type: string
          format: uri
          description: |
            Virtual-host form — `https://<service-slug>.<tenant-slug>.proxy.local`.
      required: [explicit_url, virtual_host_url]
    errors:
      - code: "service_not_found"
        message: |
          Service does not exist in this tenant, or the agent has no
          permissions on it.
    examples:
      - name: "endpoints-for-crm"
        request:
          service_id: "svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
        response:
          explicit_url: "https://proxy.local/v1/call/svc_01HX5J9F8V8H8V0CG3F2Y5J6S1"
          virtual_host_url: "https://crm.acme.proxy.local"

  # =========================================================================
  # Email-proxy tools (ADR-0024, Phase 1 REST-only on :8088)
  # ---------------------------------------------------------------------------
  # Tool prefix: email_*  (NOT mintkey_* — that prefix was a doc error)
  #
  # Implementation status (as of 2026-06-03):
  #   IMPLEMENTED (9):  email_list_mailboxes, email_search_messages,
  #                     email_fetch_message, email_send,
  #                     email_list_emails, email_download_attachment,
  #                     email_move_email, email_mark_email, email_delete_email
  #
  # Permission scopes:
  #   read:email   — email_list_mailboxes, email_search_messages,
  #                  email_fetch_message, email_list_emails,
  #                  email_download_attachment
  #   send:email   — email_send
  #   write:email  — email_move_email, email_mark_email
  #   delete:email — email_delete_email
  #
  # Scope model (Option A): the broker emits all 4 email scopes on every
  # email-service JWT; the email-proxy enforces per-endpoint scope checks.
  # Per-action scope tightening is tracked as a future enhancement.
  #
  # Parameter note: all email tools accept "email_service_id" (canonical)
  # or "service_id" (alias, PR #155). Use service_id in new code.
  #
  # All email tools require the agent to hold a brokered JWT for the email
  # service with the appropriate scope. The email-proxy validates the JWT
  # against the broker JWKS (Ed25519, kid force-refresh on unknown kid).
  #
  # Per-service SMTP routing (PR #156): smtp_host / smtp_port from the
  # registered email_service row are used directly — there are no global
  # SMTP defaults.
  # =========================================================================

  # =========================================================================
  # IMPLEMENTED TOOL 1 of 4
  - name: "email_list_mailboxes"
    description: |
      List all mailboxes (IMAP folders) for a registered email service.
      Requires `read:email` scope on the brokered JWT for `email_service_id`.
      Accepts `email_service_id` (canonical) or `service_id` (alias, PR #155).
      REST: GET /v1/tools/email_list_mailboxes?email_service_id=<svc_…>
      Returns: { "mailboxes": [...] }
    x-mintkey-scope: "read:email"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        email_service_id:
          $ref: "#/$defs/service_id"
          description: "Email service ID (canonical). Alias: service_id."
        service_id:
          $ref: "#/$defs/service_id"
          description: "Alias for email_service_id (backward compat, PR #155)."
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [mailboxes]
      properties:
        mailboxes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, delimiter]
            properties:
              name:
                type: string
              delimiter:
                type: string
              message_count:
                type: [integer, "null"]
              unseen_count:
                type: [integer, "null"]
    errors:
      - code: "service_not_found"
        message: "Email service not found or agent has no permission on it."
      - code: "unavailable"
        message: "IMAP server unreachable."

  # =========================================================================
  # IMPLEMENTED TOOL 2 of 4
  - name: "email_search_messages"
    description: |
      Search email messages using an RFC 3501 IMAP SEARCH query string.
      The query is passed parameterised to prevent injection.
      Requires `read:email` scope.
      Accepts `email_service_id` (canonical) or `service_id` (alias, PR #155).
      REST: GET /v1/tools/email_search_messages?email_service_id=<svc_…>&query=<RFC3501>&mailbox=INBOX
      Returns: { "messages": [...] }
      Workaround for missing email_list_emails: use query=ALL to enumerate all UIDs.
    x-mintkey-scope: "read:email"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [query]
      properties:
        email_service_id:
          $ref: "#/$defs/service_id"
          description: "Email service ID (canonical). Alias: service_id."
        service_id:
          $ref: "#/$defs/service_id"
          description: "Alias for email_service_id (backward compat, PR #155)."
        query:
          type: string
          maxLength: 500
          description: RFC 3501 IMAP SEARCH query string (e.g. ALL, FROM "alice@example.com").
        mailbox:
          type: string
          default: INBOX
          description: Mailbox to search (defaults to INBOX).
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
    errors:
      - code: "service_not_found"
        message: "Email service not found or agent has no permission on it."
      - code: "unavailable"
        message: "IMAP server unreachable."

  # =========================================================================
  # IMPLEMENTED TOOL 3 of 4
  - name: "email_fetch_message"
    description: |
      Fetch a single message by UID — returns the message envelope plus body.
      Response `parts[]` contains MIME parts (use for attachment download
      until email_download_attachment is implemented).
      Requires `read:email` scope.
      Accepts `email_service_id` (canonical) or `service_id` (alias, PR #155).
      REST: GET /v1/tools/email_fetch_message?email_service_id=<svc_…>&message_id=<UID>&mailbox=INBOX
    x-mintkey-scope: "read:email"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        email_service_id:
          $ref: "#/$defs/service_id"
          description: "Email service ID (canonical). Alias: service_id."
        service_id:
          $ref: "#/$defs/service_id"
          description: "Alias for email_service_id (backward compat, PR #155)."
        message_id:
          type: string
          description: Provider UID (integer or string depending on IMAP server).
        mailbox:
          type: string
          default: INBOX
          description: Mailbox containing the message (defaults to INBOX).
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: true
      description: Message envelope + body. See openapi.yaml EmailMessage schema.
    errors:
      - code: "service_not_found"
        message: "Email service not found or agent has no permission on it."
      - code: "unavailable"
        message: "IMAP server unreachable."

  # =========================================================================
  # IMPLEMENTED TOOL 4 of 4
  - name: "email_send"
    description: |
      Send an email message via SMTP. All recipient addresses are RFC 5322
      validated and the domain allowlist is enforced. Requires `send:email` scope.
      Accepts `email_service_id` (canonical) or `service_id` (alias, PR #155).
      Per-service SMTP routing (PR #156): smtp_host / smtp_port from the registered
      email_service row are used — there are no global SMTP defaults.
      REST: POST /v1/tools/email_send with JSON body.
      Returns: { "message_id": "...", "status": "sent" }
    x-mintkey-scope: "send:email"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [to, subject, body]
      properties:
        email_service_id:
          $ref: "#/$defs/service_id"
          description: "Email service ID (canonical). Alias: service_id."
        service_id:
          $ref: "#/$defs/service_id"
          description: "Alias for email_service_id (backward compat, PR #155)."
        to:
          type: array
          items:
            type: string
            format: email
          minItems: 1
          description: Primary recipients.
        cc:
          type: array
          items:
            type: string
            format: email
          description: CC recipients.
        bcc:
          type: array
          items:
            type: string
            format: email
          description: BCC recipients.
        subject:
          type: string
          maxLength: 998
        body:
          type: string
          description: Plain-text body.
        html_body:
          type: [string, "null"]
          description: "Optional HTML body. (Note: field is html_body, not body_html.)"
        attachments:
          type: array
          items:
            type: object
            required: [filename, content_type, content_base64]
            properties:
              filename:
                type: string
              content_type:
                type: string
              content_base64:
                type: string
                format: byte
          description: Optional attachments (max 25 MiB each, 50 MiB total).
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [message_id]
      properties:
        message_id:
          type: string
          description: Provider-assigned Message-ID.
    errors:
      - code: "service_not_found"
        message: "Email service not found or agent has no permission on it."
      - code: "invalid_argument"
        message: "Invalid recipient address, header injection attempt, or attachment too large."
      - code: "unavailable"
        message: "SMTP server unreachable."

