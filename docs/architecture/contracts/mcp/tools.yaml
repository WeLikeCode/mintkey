  # =========================================================================
  # Agent Secret tools (ADR-0025, Phase 1 Postgres backend)
  # ---------------------------------------------------------------------------
  # Tool prefix: secret_*
  #
  # Permission scopes (MCP-server internal — not brokered JWT scopes):
  #   write:secrets  — secret_put
  #   read:secrets   — secret_get, secret_list
  #   delete:secrets — secret_delete
  #
  # Anti-enumeration: secret_get and secret_delete return secret_not_found
  # for both nonexistent and not-visible secrets (ADR-0025.D5).
  #
  # tenant_id and agent identity come from the authenticated agent context,
  # never from tool input (per multi-tenancy comment at the top of this file).
  # =========================================================================

  # =========================================================================
  - name: "secret_put"
    description: |
      Store (or overwrite) a named secret owned by the calling agent.
      The value is envelope-encrypted (AES-256-GCM, fresh DEK per write)
      before reaching storage. Requires `write:secrets` scope.
      Storing to an existing name increments the version.
      REST: POST /v1/tools/secret_put
      Emits audit event: agent_secret.created (first store) or agent_secret.updated (overwrite).
    x-mintkey-scope: "write:secrets"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          pattern: "^[a-zA-Z0-9._-]{1,128}$"
          description: |
            Secret name, unique per owning agent. Allowed characters:
            alphanumeric, dot, underscore, hyphen. 1–128 characters.
        value:
          type: string
          maxLength: 65536
          description: |
            Secret value (UTF-8 string). Binary material should be
            base64-encoded by the caller. Max 65536 bytes.
        content_type:
          type: string
          maxLength: 128
          description: |
            Optional free-text hint (e.g. "application/json",
            "text/plain", "application/x-pem-file").
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [secret_id, name, version]
      properties:
        secret_id:
          $ref: "#/$defs/secret_id"
        name:
          type: string
        version:
          type: integer
          minimum: 1
    errors:
      - code: "invalid_argument"
        message: "`name` is malformed, or `value` exceeds 65536 bytes."
      - code: "not_authorized"
        message: "Agent is not authenticated or has been revoked."
      - code: "unavailable"
        message: "Vault Adapter or Postgres unreachable."

  # =========================================================================
  - name: "secret_get"
    description: |
      Read the plaintext value of a secret the calling agent owns or has
      been granted read access to. Returns the uniform not-found error for
      both nonexistent and not-visible secrets (anti-enumeration, ADR-0025.D5).
      Requires `read:secrets` scope.
      REST: GET /v1/tools/secret_get?secret_id=<sec_…>
      Emits audit event: agent_secret.read (identifier-only payload, no value).
    x-mintkey-scope: "read:secrets"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [secret_id]
      properties:
        secret_id:
          $ref: "#/$defs/secret_id"
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [secret_id, name, version, value]
      properties:
        secret_id:
          $ref: "#/$defs/secret_id"
        name:
          type: string
        version:
          type: integer
          minimum: 1
        value:
          type: string
          x-mintkey-sensitive: true
          description: |
            Plaintext secret value. SENSITIVE — do not log or persist.
            Marked x-mintkey-sensitive: true.
        content_type:
          type: [string, "null"]
        access:
          type: string
          enum: [owner, shared]
          description: Whether the caller owns this secret or holds a share grant.
    errors:
      - code: "secret_not_found"
        message: |
          Secret does not exist or is not visible to the calling agent
          (uniform not-found — indistinguishable by design, ADR-0025.D5).
      - code: "invalid_argument"
        message: "`secret_id` is malformed."
      - code: "not_authorized"
        message: "Agent is not authenticated or has been revoked."
      - code: "unavailable"
        message: "Vault Adapter or Postgres unreachable."

  # =========================================================================
  - name: "secret_list"
    description: |
      List metadata for all secrets the calling agent owns plus all secrets
      shared with it. Never returns secret values. Requires `read:secrets` scope.
      REST: GET /v1/tools/secret_list
      Pagination by ULID cursor (after / limit).
    x-mintkey-scope: "read:secrets"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties:
        after:
          $ref: "#/$defs/secret_id"
          description: "Optional pagination cursor — secret_id from the previous page. Exclusive."
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [secrets, next_cursor]
      properties:
        secrets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [secret_id, name, version, size_bytes, access, created_at, updated_at]
            properties:
              secret_id:
                $ref: "#/$defs/secret_id"
              name:
                type: string
              version:
                type: integer
                minimum: 1
              size_bytes:
                type: integer
                minimum: 0
              content_type:
                type: [string, "null"]
              access:
                type: string
                enum: [owner, shared]
                description: Whether the calling agent owns this secret or holds a share grant.
              created_at:
                $ref: "#/$defs/timestamp"
              updated_at:
                $ref: "#/$defs/timestamp"
        next_cursor:
          type: [string, "null"]
    errors:
      - code: "invalid_argument"
        message: "`limit` out of range or `after` is malformed."
      - code: "not_authorized"
        message: "Agent is not authenticated or has been revoked."

  # =========================================================================
  - name: "secret_delete"
    description: |
      Delete a secret owned by the calling agent. Cascades any share grants.
      Idempotent: returns success for already-deleted secrets.
      Returns the uniform not-found error for secrets not owned by the caller
      (anti-enumeration, ADR-0025.D5). Requires `delete:secrets` scope.
      REST: DELETE /v1/tools/secret_delete?secret_id=<sec_…>
      Emits audit event: agent_secret.deleted.
    x-mintkey-scope: "delete:secrets"
    x-mintkey-status: "implemented"
    input_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      required: [secret_id]
      properties:
        secret_id:
          $ref: "#/$defs/secret_id"
    output_schema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      additionalProperties: false
      properties: {}
    errors:
      - code: "secret_not_found"
        message: |
          Secret does not exist or is not owned by the calling agent
          (uniform not-found — indistinguishable by design, ADR-0025.D5).
      - code: "invalid_argument"
        message: "`secret_id` is malformed."
      - code: "not_authorized"
        message: "Agent is not authenticated or has been revoked."
      - code: "unavailable"
        message: "Vault Adapter or Postgres unreachable."

# ---------------------------------------------------------------------------
# Tenant or agent deletion mid-session (per ADR-0016.7)
# ---------------------------------------------------------------------------
# When an agent is revoked or its tenant is deleted while an MCP session is open:
#   * HTTP/SSE: server emits a final error frame with code `agent_revoked` or
#     `tenant_deleted`, then closes the connection.
#   * stdio:    server prints the same error frame, then EOF.
# Subsequent tool calls bearing the agent's API key receive 401 with the same code.
# In-flight read-only tool calls (`list_services`, `describe_service`,
# `get_openapi`) complete with the snapshot they had. State-changing calls
# (`request_token`) abort with code `tenant_deleted`.

# ---------------------------------------------------------------------------
# Authentication (per ADR-0009 + ADR-0017)
# ---------------------------------------------------------------------------
# Agents authenticate with a Bearer Agent API Key in the HTTP `Authorization`
# header for HTTP/SSE transport, or via env var for stdio transport.
# The MCP server:
#   1. Format-checks the prefix `mk_agent_` (constant time).
#   2. Looks up the key by its 8-char fingerprint.
#   3. Verifies via `argon2id` `subtle.ConstantTimeCompare`.
# Per OQ-015 the verification implementation specifics are pinned in iteration 4 closeout.
