<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Direct API key exposure compared with Mintkey brokered access</title>
  <desc id="desc">Side-by-side comparison showing an agent leaking a long-lived API key without Mintkey, and leaking only a short-lived scoped token when using Mintkey and an egress proxy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAF8"/>
      <stop offset=".55" stop-color="#EEF9F5"/>
      <stop offset="1" stop-color="#DDF7EF"/>
    </linearGradient>
    <linearGradient id="bad-card" x1="90" y1="150" x2="735" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7F2"/>
      <stop offset="1" stop-color="#FFEAE6"/>
    </linearGradient>
    <linearGradient id="good-card" x1="865" y1="150" x2="1510" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FFFA"/>
      <stop offset="1" stop-color="#DDF7EF"/>
    </linearGradient>
    <linearGradient id="mint" x1="1020" y1="606" x2="1240" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20C389"/>
      <stop offset=".6" stop-color="#2EE6A6"/>
      <stop offset="1" stop-color="#36D69D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="124%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#101820" flood-opacity=".14"/>
    </filter>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2l8 4-8 4z" fill="#D64A3A"/>
    </marker>
    <marker id="arrow-mint" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M2 2l8 4-8 4z" fill="#20C389"/>
    </marker>
    <style>
      .title { font: 800 48px Inter, Avenir Next, ui-sans-serif, system-ui, sans-serif; fill: #101820; letter-spacing: 0; }
      .subtitle { font: 500 22px Inter, Avenir Next, ui-sans-serif, system-ui, sans-serif; fill: #31413D; letter-spacing: 0; }
      .panel-title { font: 800 34px Inter, Avenir Next, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .label { font: 760 24px Inter, Avenir Next, ui-sans-serif, system-ui, sans-serif; fill: #101820; letter-spacing: 0; }
      .small { font: 500 18px Inter, Avenir Next, ui-sans-serif, system-ui, sans-serif; fill: #44524E; letter-spacing: 0; }
      .tiny { font: 700 16px Inter, Avenir Next, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
      .mono { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="78" text-anchor="middle" class="title">Credential exposure changes the blast radius</text>
  <text x="800" y="118" text-anchor="middle" class="subtitle">Direct agent keys leak the real credential. Mintkey leaks only a scoped temporary token.</text>

  <g filter="url(#shadow)">
    <rect x="78" y="155" width="682" height="640" rx="28" fill="url(#bad-card)" stroke="#F2B9AF"/>
    <rect x="840" y="155" width="682" height="640" rx="28" fill="url(#good-card)" stroke="#B7EADA"/>
  </g>

  <g>
    <text x="120" y="214" class="panel-title" fill="#A72F24">Without Mintkey</text>
    <text x="120" y="250" class="small">Agent receives the actual long-lived API key.</text>

    <rect x="134" y="306" width="190" height="86" rx="14" fill="#FFFFFF" stroke="#E9B2AA"/>
    <text x="229" y="342" text-anchor="middle" class="label">Operator</text>
    <text x="229" y="370" text-anchor="middle" class="small">sets raw key</text>

    <rect x="420" y="296" width="210" height="106" rx="18" fill="#FFFFFF" stroke="#E9B2AA"/>
    <circle cx="469" cy="349" r="24" fill="#101820"/>
    <path d="M466 349h84m-32 0v24m28-24v-18" fill="none" stroke="#D64A3A" stroke-width="10" stroke-linecap="round"/>
    <text x="545" y="342" class="label">Agent</text>
    <text x="545" y="370" class="small">holds API key</text>

    <rect x="420" y="522" width="210" height="92" rx="18" fill="#FFFFFF" stroke="#E9B2AA"/>
    <text x="525" y="560" text-anchor="middle" class="label">External API</text>
    <text x="525" y="588" text-anchor="middle" class="small">accepts raw key</text>

    <rect x="134" y="522" width="190" height="92" rx="18" fill="#FFFFFF" stroke="#E9B2AA"/>
    <text x="229" y="558" text-anchor="middle" class="label">Attacker</text>
    <text x="229" y="586" text-anchor="middle" class="small">replays key</text>

    <path d="M326 349h84" fill="none" stroke="#D64A3A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-red)"/>
    <text x="368" y="329" text-anchor="middle" class="tiny" fill="#A72F24">long-lived</text>
    <path d="M525 404v106" fill="none" stroke="#D64A3A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-red)"/>
    <path d="M420 350c-150 28-212 76-191 158" fill="none" stroke="#D64A3A" stroke-width="6" stroke-linecap="round" stroke-dasharray="13 12" marker-end="url(#arrow-red)"/>
    <text x="252" y="458" text-anchor="middle" class="tiny" fill="#A72F24">prompt injection leak</text>
    <path d="M326 568h84" fill="none" stroke="#D64A3A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-red)"/>

    <rect x="128" y="680" width="520" height="70" rx="16" fill="#FFF1EF" stroke="#D64A3A"/>
    <text x="388" y="710" text-anchor="middle" class="mono" fill="#A72F24">api_key = live credential</text>
    <text x="388" y="738" text-anchor="middle" class="small">valid until detection, revocation, or rotation</text>
  </g>

  <g>
    <text x="882" y="214" class="panel-title" fill="#0B6E4F">With Mintkey</text>
    <text x="882" y="250" class="small">Agent receives a short-lived scoped token, not the API key.</text>

    <rect x="908" y="306" width="190" height="86" rx="14" fill="#FFFFFF" stroke="#B7EADA"/>
    <text x="1003" y="342" text-anchor="middle" class="label">Agent</text>
    <text x="1003" y="370" text-anchor="middle" class="small">uses temp token</text>

    <rect x="1186" y="292" width="210" height="134" rx="18" fill="#FFFFFF" stroke="#B7EADA"/>
    <g transform="translate(1259 306) scale(.25)">
      <path fill="url(#mint)" d="M128 9c-37 22-63 48-78 79-19 40-11 83 23 119 15 16 33 30 55 43 29-17 52-36 68-58 25-36 28-76 9-114-16-31-42-54-77-69Z"/>
      <path fill="#F7FAF8" d="M133 31c30 17 52 41 64 69 13 33 4 65-24 91-11 11-25 20-40 29v-64c26-9 47-27 61-54-12-27-33-51-61-71Z"/>
      <path fill="#101820" fill-rule="evenodd" d="M127 68a34 34 0 0 0-13 65v88l14 9 26-15v-13h-20v-14h27v-18h-27v-37a34 34 0 0 0-7-65Zm0 20a14 14 0 1 1 0 28 14 14 0 0 1 0-28Z"/>
      <circle cx="127" cy="102" r="14" fill="#F7FAF8"/>
    </g>
    <text x="1291" y="404" text-anchor="middle" class="label">Mintkey</text>

    <rect x="1186" y="548" width="210" height="92" rx="18" fill="#FFFFFF" stroke="#B7EADA"/>
    <text x="1291" y="586" text-anchor="middle" class="label">Egress proxy</text>
    <text x="1291" y="614" text-anchor="middle" class="small">injects key</text>

    <rect x="908" y="548" width="190" height="92" rx="18" fill="#FFFFFF" stroke="#B7EADA"/>
    <text x="1003" y="584" text-anchor="middle" class="label">Attacker</text>
    <text x="1003" y="612" text-anchor="middle" class="small">gets JWT only</text>

    <path d="M1099 349h76" fill="none" stroke="#20C389" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-mint)"/>
    <text x="1138" y="328" text-anchor="middle" class="tiny" fill="#0B6E4F">request token</text>
    <path d="M1291 434v102" fill="none" stroke="#20C389" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-mint)"/>
    <path d="M1186 594h-76" fill="none" stroke="#C7A64A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-mint)"/>
    <path d="M908 350c-116 36-121 125 82 183" fill="none" stroke="#C7A64A" stroke-width="6" stroke-linecap="round" stroke-dasharray="13 12" marker-end="url(#arrow-red)"/>
    <text x="966" y="462" text-anchor="middle" class="tiny" fill="#6F581D">if prompt injection leaks</text>

    <rect x="900" y="680" width="520" height="70" rx="16" fill="#E8FFF5" stroke="#20C389"/>
    <text x="1160" y="710" text-anchor="middle" class="mono" fill="#0B6E4F">jwt = scoped temporary access</text>
    <text x="1160" y="738" text-anchor="middle" class="small">real credential stays encrypted and proxy-held</text>
  </g>
</svg>
