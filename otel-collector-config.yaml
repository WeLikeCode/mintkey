# OTel Collector config — from design §13.
# Two-layer redaction: SDK-level (T-1.0.14) + this Collector layer (T-1.10.1).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  # Defense-in-depth redaction. Primary redaction is at the SDK (T-1.0.14 / ADR-0017.6).
  attributes/redact:
    actions:
      - { key: mintkey.token,                           action: delete }
      - { key: mintkey.api_key,                         action: delete }
      - { key: mintkey.password,                        action: delete }
      - { key: mintkey.authorization_header,            action: delete }
      - { key: mintkey.cookie_value,                    action: delete }
      - { key: mintkey.set_cookie_value,                action: delete }
      - { key: http.request.header.authorization,       action: delete }
      - { key: http.request.header.cookie,              action: delete }
      - { key: http.response.header.set-cookie,         action: delete }

  redaction:
    allow_all_keys: true
    blocked_values:
      - 'sk_[a-zA-Z0-9_-]{20,}'
      - 'pk_[a-zA-Z0-9_-]{20,}'
      - 'eyJ[A-Za-z0-9+/=._-]{20,}'
      - 'mk_agent_[a-zA-Z0-9_-]{8,}'
      - 'mk_svckey_[a-zA-Z0-9_-]{8,}'
    summary: silent

exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
  prometheus:
    endpoint: 0.0.0.0:8889
  # debug exporter — logs redacted spans to collector stdout for CI verification.
  # Verbosity "detailed" prints span attributes so redaction can be confirmed.
  debug:
    verbosity: detailed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [batch, attributes/redact, redaction]
      exporters:  [otlphttp/jaeger, debug]
    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus]
