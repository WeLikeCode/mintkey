[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mintkey-models"
version = "0.1.0-preview.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "sqlalchemy[asyncio]>=2.0.50",
    "prometheus-client>=0.25.0",
    "cryptography>=48.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mintkey_models*"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
strict = true
python_version = "3.12"
