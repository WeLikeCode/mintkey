[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mintkey-models"
version = "0.1.0-preview.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "prometheus-client>=0.20",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mintkey_models*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=2.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
strict = true
python_version = "3.12"
