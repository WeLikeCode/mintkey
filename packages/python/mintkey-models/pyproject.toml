[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mintkey-models"
version = "0.1.0-preview.1"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.2",
    "sqlalchemy[asyncio]>=2.1.4",
    "prometheus-client>=0.26.0",
    "cryptography>=50.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mintkey_models*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.15.18",
    "mypy>=2.4.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
strict = true
python_version = "3.12"
