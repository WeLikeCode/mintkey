# Prometheus config — scrapes OTel Collector prometheus exporter and service health endpoints.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: admin-api
    metrics_path: /metrics
    static_configs:
      - targets: ["admin-api:8080"]

  - job_name: broker
    metrics_path: /metrics
    static_configs:
      - targets: ["broker:8083"]

  - job_name: vault-adapter
    metrics_path: /metrics
    static_configs:
      - targets: ["vault-adapter:8087"]

  - job_name: mcp-server
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-server:8082"]

  - job_name: kong-syncer
    metrics_path: /metrics
    static_configs:
      - targets: ["kong-syncer:8085"]

  - job_name: proxy-plugin
    metrics_path: /metrics
    static_configs:
      - targets: ["proxy-plugin:8086"]

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8088"]
